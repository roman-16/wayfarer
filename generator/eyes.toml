[eyes.black]
tier = 1
biomes = [
  "#c:is_beach",
  "#c:is_stony_shores",
  "#minecraft:is_beach",
  "minecraft:stony_shore",
]
people = "The Tide Folk"
hint = "The Tide Folk kept their shard where the land gives up and the sea begins. Walk the beaches and stony shores until the ember answers."
lore = [
  "The Tide Folk lived where the land gives up and the sea begins. They took the black shard because no one else wanted a thing that drank the light.",
  "They buried it the way they buried everything worth keeping: below the tideline, under a fire that was never lit twice in the same place.",
  "If you are reading this, the fire was lit again. Take the shard. The sea will forget us, as it should.",
]

[eyes.black.place]
find = "The Tide Folk's last ship. Under the rotten deck, wrapped in oiled skin, something they could not carry."
gift = { item = "artifacts:snorkel", name = "The Tide Folk's Snorkel" }
line = "Our last ship lies wrecked {lead}. What we could not carry is still aboard."
mark = "Their ship"
structures = [
  "minecraft:shipwreck_beached",
  "minecraft:shipwreck",
  "structory:boat",
]
title = "The Tide Folk's Ship"

[eyes.cold]
tier = 1
biomes = ["#c:is_snowy", "#c:is_icy"]
people = "The Frost Walkers"
hint = "The Frost Walkers never stayed anywhere the snow could not cover their tracks. Go where the cold is deepest and listen for the ember."
lore = [
  "The Frost Walkers never stopped moving. Their villages were tracks in the snow, gone by morning.",
  "They carried the cold shard for a hundred winters and said it was the only fire that never burned them.",
  "When the last of them grew too old to walk, they set it here, under the ice, where nothing stays still long enough to be seen.",
]

[eyes.cold.place]
find = "A house of snow the Frost Walkers built. By the cold hearth, a pair of their shoes."
gift = { item = "artifacts:snowshoes", name = "The Frost Walkers' Snowshoes" }
line = "Once a winter we built a house of snow, {lead}. Something of ours still waits in it."
mark = "Their winter house"
structures = [
  "minecraft:igloo",
  "mvs:medium_igloo_1",
  "mvs:medium_igloo_2",
  "mvs:small_igloo",
  "terralith:igloo",
]
title = "The Frost Walkers' House"

[eyes.corrupted]
tier = 2
biomes = ["#c:is_savanna", "#minecraft:is_savanna"]
people = "The Grass Kingdom"
hint = "A king kept this shard on his throne, and it made him the first of the Gazebound. It sleeps under the savanna grass now; find it before his heirs do."
lore = [
  "The Grass Kingdom was given its shard to hide. Its king kept it instead, on a throne, where everyone could see it.",
  "The shard showed him what the dragon sees, and he wanted more. He was the first of the Gazebound.",
  "His own people tore the shard from his crown and sealed it here. The throne is dust. Do not keep what you carry.",
]

[eyes.corrupted.place]
find = "The Grass Kingdom's people still live here. They give the jewel from the king's crown to whoever took his shard."
gift = { item = "artifacts:crystal_heart", name = "The Grass King's Jewel" }
line = "His people still live in the grass, {lead}. They kept the jewel that sat beside the shard in his crown."
mark = "His people"
structures = [
  "ctov:large/village_savanna",
  "ctov:medium/village_savanna",
  "ctov:small/village_savanna",
  "minecraft:village_savanna",
  "trek:village/savanna",
]
title = "The Grass Kingdom"

[eyes.cryptic]
tier = 2
biomes = ["#c:is_mountain", "#minecraft:is_mountain"]
people = "The Scribes of the Peaks"
hint = "The Scribes climbed as high as the land allows and wrote down what the shard whispered. Search the mountains, and read their book before you take it."
lore = [
  "The Scribes climbed as high as the land would let them and wrote down everything the shard whispered.",
  "Most of it was madness. Some of it was the way the true gate was built, and why it must never be built again.",
  "We burned the madness and kept the rest. The shard we leave to you. Read before you carry it.",
]

[eyes.cryptic.place]
find = "High among the peaks, where the Scribes lived. On a shelf of books nobody can read any more, a bottle of cloud."
gift = { item = "artifacts:cloud_in_a_bottle", name = "The Scribes' Bottled Cloud" }
line = "We lived where the peaks meet the sky, {lead}. Climb up and take what we left."
mark = "Their house"
structures = [
  "ctov:medium/village_mountain",
  "ctov:medium/village_mountain_alpine",
  "ctov:small/village_mountain",
  "ctov:small/village_mountain_alpine",
  "terralith:rubble_mountain",
  "trek:overworld/medium/all_abandoned",
]
title = "The Scribes' House"

[eyes.evil]
tier = 2
biomes = [
  "#c:is_plains",
  "minecraft:meadow",
  "minecraft:plains",
  "minecraft:sunflower_plains",
]
people = "The First Village"
hint = "The First Village forgot the oath and was seen. Its shard lies under the plains and meadows where the village once stood."
lore = [
  "The First Village was built by Wayfarers who swore they would only stay one winter.",
  "They stayed a hundred. Their priests said the shard in their temple kept them safe. It was the shard that kept them seen.",
  "When the gaze came, the last priest carried it out into the grass and buried it here. The village is gone. The grass remembers.",
]

[eyes.evil.place]
find = "The ruins of the First Village. In the dust of the temple, the last priest's charm."
gift = { item = "artifacts:cross_necklace", name = "The Last Priest's Charm" }
line = "The ruins of the village stand {lead}. The last priest left his charm there."
mark = "The first village"
structures = [
  "explorify:ruins",
  "nova_structures:remnant_classic_village",
  "nova_structures:ruin_town",
  "structory:ruin_grassy",
  "towns_and_towers:village_forest",
]
title = "The First Village"

[eyes.exotic]
tier = 2
biomes = ["#c:is_badlands", "#minecraft:is_badlands"]
people = "The Drowned City"
hint = "The last of the Drowned City fled as far from the sea as they could. Search the red canyons of the badlands."
lore = [
  "Before the sea took it, the Drowned City was the most beautiful place in the world. Beautiful things are seen.",
  "The few who swam out carried the exotic shard inland, as far from water as they could, into the red canyons.",
  "They never saw the sea again. They said it was worth it. We hope you agree.",
]

[eyes.exotic.place]
find = "The swimmers' last home, dry as bone. Hung on a wall, fins that have not touched water in an age."
gift = { item = "artifacts:flippers", name = "The Swimmers' Flippers" }
line = "The swimmers settled {lead}, among the red stone. They never swam again, but they kept their fins."
mark = "Where they settled"
structures = [
  "ctov:medium/village_mesa",
  "ctov:small/village_mesa",
  "explorify:badlands_pyramid",
  "towns_and_towers:village_badlands",
]
title = "Where the Swimmers Settled"

[eyes.lost]
tier = 1
biomes = ["#c:is_forest", "#minecraft:is_forest"]
people = "The Diggers"
hint = "The Diggers lost their shard three times before they built it a hall. It waits under a forest; let the ember lead you down."
lore = [
  "The Diggers went down because down was the only way the gaze did not follow. Their tunnels run under half the world.",
  "They lost the shard three times, and found it three times, and in the end they built it a hall so it would stop wandering.",
  "If it wanders again, let it wander with you.",
]

[eyes.lost.place]
find = "The Diggers' tunnels. On a beam, a pair of claws worn smooth by half the world's stone."
gift = { item = "artifacts:digging_claws", name = "The Diggers' Claws" }
line = "Our tunnels start {lead}. What we could not carry is still down there."
mark = "Their tunnels"
structures = [
  "bettermineshafts:mineshaft_acacia",
  "bettermineshafts:mineshaft_desert",
  "bettermineshafts:mineshaft_dripstone",
