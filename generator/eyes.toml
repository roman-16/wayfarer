  "bettermineshafts:mineshaft_jungle",
  "bettermineshafts:mineshaft_lush",
  "bettermineshafts:mineshaft_mesa",
  "bettermineshafts:mineshaft_mushroom",
  "bettermineshafts:mineshaft_oak",
  "bettermineshafts:mineshaft_overgrown",
  "bettermineshafts:mineshaft_red_desert",
  "bettermineshafts:mineshaft_spruce",
  "bettermineshafts:mineshaft_spruce_snowy",
  "minecraft:mineshaft",
  "minecraft:mineshaft_mesa",
]
title = "The Diggers' Tunnels"

[eyes.magical]
tier = 2
biomes = ["#c:is_dark_forest", "minecraft:dark_forest"]
people = "The Shadow Circle"
hint = "The Shadow Circle taught the Illagers more than it should have. Its shard is hidden in the dark forests, not far from the mansions it inspired."
lore = [
  "The Shadow Circle learned to bend the shard's light into spells. The Illagers learned from them, and learned the wrong lessons.",
  "Their mansions in the dark woods are copies of our halls, built by people who wanted the shard's power without its burden.",
  "The burden is the point. Carry it.",
]

[eyes.magical.place]
find = "The Illagers copied the Shadow Circle's halls here. In a cellar they never found, a pair of lenses for the dark."
gift = { item = "artifacts:night_vision_goggles", name = "The Shadow Circle's Lenses" }
line = "The Illagers copied our halls {lead}. Our cellar under them is still hidden."
mark = "Their cellar"
structures = [
  "explorify:dark_forest_settlement",
  "minecraft:mansion",
  "nova_structures:illager_manor",
  "trek:overworld/rare/pillager_mansion",
]
title = "The Shadow Circle's Cellar"

[eyes.old]
tier = 1
biomes = ["#c:is_desert", "minecraft:desert"]
people = "The Sand Singers"
hint = "The Sand Singers let the desert bury their hall. Cross the dunes and dig where the ember burns hottest."
lore = [
  "The Sand Singers say a great worm sleeps under the desert, and that it swallowed the old shard to keep it safe.",
  "The truth is simpler. We dug this hall and let the sand cover it, and the worm is a story we told to keep treasure hunters away.",
  "The worm is not a story. Walk softly.",
]

[eyes.old.place]
find = "The Sand Singers' first hall, half under the dunes. Leaning in a corner, their shade against the sun."
gift = { item = "artifacts:umbrella", name = "The Sand Singers' Shade" }
line = "Our first hall lies buried {lead}. We left our shade there."
mark = "Their buried hall"
structures = [
  "betterdeserttemples:desert_temple",
  "minecraft:desert_pyramid",
  "trek:overworld/medium/small_pyramide",
]
title = "The Sand Singers' Hall"

[eyes.rogue]
tier = 1
biomes = ["#c:is_jungle", "#minecraft:is_jungle"]
people = "The Jungle Folk"
hint = "The Jungle Folk built locks that never slept, and still they had to leave. Their shard waits somewhere under the jungle."
lore = [
  "The rogue shard taught the Jungle Folk how red dust carries a thought from one stone to the next.",
  "They built doors that opened themselves and traps that never slept, and still the gaze found their temples.",
  "No lock keeps out a god. Only leaving does. So we left, and left the shard to you.",
]

[eyes.rogue.place]
find = "The Jungle Folk's temple. Among the dust, one of the little pistons that carried their thoughts from stone to stone."
gift = { item = "artifacts:pocket_piston", name = "The Jungle Folk's Piston" }
line = "Our temple stands {lead}. Mind the locks; they never sleep."
mark = "Their temple"
structures = [
  "betterjungletemples:jungle_temple",
  "minecraft:jungle_pyramid",
  "nova_structures:jungle_ruins",
  "structory:jungle_ruin",
]
title = "The Jungle Folk's Temple"

[eyes.undead]
tier = 2
biomes = [
  "minecraft:old_growth_pine_taiga",
  "minecraft:old_growth_spruce_taiga",
  "#c:is_old_growth",
]
people = "The Grave Keepers"
hint = "The Grave Keepers hid their shard among the dead, under the oldest trees. Walk the old-growth taiga and keep your voice low."
lore = [
  "The Grave Keepers buried the Wayfarers who fell on the road, under the oldest trees, where the ground is soft.",
  "They noticed that the dead are never seen by the gaze, and they took the undead shard to hide among them.",
  "We are among them now. Take the shard and keep walking. We will keep the graves.",
]

[eyes.undead.place]
find = "The Grave Keepers' graves. Folded on a stone, the scarf they wore among the dead."
gift = { item = "artifacts:scarf_of_invisibility", name = "The Grave Keepers' Scarf" }
line = "Our graves lie {lead}. The dead are never seen, and neither is what we left them."
mark = "Their graves"
structures = [
  "explorify:mausoleum",
  "nova_structures:creeping_crypt",
  "nova_structures:remnant_graveyard",
  "structory:graveyard",
  "trek:overworld/medium/graveyard",
]
title = "The Grave Keepers' Graves"

[eyes.witch]
tier = 1
biomes = ["#c:is_swamp", "minecraft:mangrove_swamp", "minecraft:swamp"]
people = "The Marsh Mothers"
hint = "The Marsh Mothers sank their shard where no reflection lives. Wade into the swamps and follow the ember."
lore = [
  "The Marsh Mothers brewed with everything the swamp gave them, and the witch shard gave them sight.",
  "They saw the dragon seeing them, and they stopped brewing, and they sank the shard into the mud where no reflection lives.",
  "The witches in their huts still remember us. They do not remember why.",
]

[eyes.witch.place]
find = "A hut the witches keep for the Marsh Mothers. On the shelf, their last good brew."
gift = { item = "artifacts:antidote_vessel", name = "The Marsh Mothers' Brew" }
line = "The witches keep our last hut {lead}. They do not remember why; they only keep it."
mark = "Their hut"
structures = [
  "betterwitchhuts:witch_hut",
  "minecraft:swamp_hut",
  "nova_structures:mangrove_witch_hut",
  "terralith:witch_hut",
]
title = "The Marsh Mothers' Hut"
