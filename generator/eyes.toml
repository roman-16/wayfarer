palette = { floor = "minecraft:smooth_sandstone", light = "minecraft:ochre_froglight", pillar = "minecraft:chiseled_sandstone", plant = "minecraft:dead_bush", shell = "minecraft:sandstone", stairs = "minecraft:sandstone_stairs", trim = "minecraft:cut_sandstone" }
people = "The Sand Singers"
hint = "The Sand Singers let the desert bury their hall. Cross the dunes and dig where the ember burns hottest."
lore = [
  "The Sand Singers say a great worm sleeps under the desert, and that it swallowed the old shard to keep it safe.",
  "The truth is simpler. We dug this hall and let the sand cover it, and the worm is a story we told to keep treasure hunters away.",
  "The worm is not a story. Walk softly.",
]

