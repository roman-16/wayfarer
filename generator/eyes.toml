[eyes.black]
act = 2
climate = "any"
biomes = [
  "#c:is_beach",
  "#c:is_stony_shores",
  "#minecraft:is_beach",
  "minecraft:stony_shore",
]
people = "The Tide Folk"
lore = [
  "[calm, proud] We are the Tide Folk, and this is our bay. Nothing comes up out of it at night, so our boats go out with lamps lit, and we eat.",
  "[grave] The Drowned City's last swam in on a winter tide with their stone in a net between them, and asked us to keep it from the eye that drowned them. We swore on the fire pit.",
  "[quiet, pleading] If you are reading this, you carry a fire in your hand, and you know what lies on our stone. Take what you must. [softly] Leave us the dark.",
]


[eyes.cold]
act = 1
climate = "cold"
biomes = ["#c:is_snowy", "#c:is_icy"]
people = "The Frost Walkers"
lore = [
  "[proud, steady] We are the Frost Walkers. We walk all summer and come home to this hall for the winter, to the stone that remembers.",
  "[urgent, shaken] Tonight someone came down the stair while we slept. When the lamps were lit again, the stone was empty. The young ones ran up after him.",
  "[frail, quiet] I am too old for the stair. [pause] The shouting up there has stopped. [whispers] I can hear the snow.",
  "[tender, fading] One of ours is still out on the hunt. If she comes home, tell her not to wait for us. [voice breaking] Tell her to keep walking.",
]


[eyes.corrupted]
people = "The Grass Kingdom"


[eyes.cryptic]
act = 3
climate = "any"
biomes = ["#c:is_mountain", "#minecraft:is_mountain"]
people = "The Scribes of the Peaks"
lore = [
  "[precise, hushed] The Scribes climbed as high as the land would let them and wrote down everything the shard whispered.",
  "[haunted] Most of it was madness. Some of it was the way the true gate was built, [grave] and why it must never be built again.",
  "[austere] We burned the madness and kept the rest. The shard we leave to you. [pause] Read before you carry it.",
]


[eyes.evil]
act = 1
climate = "any"
biomes = [
  "#c:is_plains",
  "minecraft:meadow",
  "minecraft:plains",
  "minecraft:sunflower_plains",
]
people = "The First Village"
lore = [
  "[gentle, rueful] The First Village was built by Wayfarers who swore they would only stay one winter.",
  "[sorrowful] They stayed a hundred. Their priests said the shard in their temple kept them safe. [pause] It was the shard that kept them seen.",
  "[softly] When the gaze came, the last priest carried it out into the grass and buried it here. The village is gone. [pause] The grass remembers.",
]


[eyes.exotic]
people = "The Drowned City"


[eyes.lost]
act = 1
climate = "mild"
biomes = ["#c:is_forest", "#minecraft:is_forest"]
people = "The Diggers"
lore = [
  "[steady, plain] We dug down because the eye in the sky cannot see through stone. The shard hums on its stone in this hall, and while it hums, the ground above us stays dark to that eye.",
  "[fond, then heavy] Our children grew up under lamps and never missed the sun. But the seams near the hall ran out, and the young ones wanted to follow the ore down, past the shard's ground.",
  "[resigned, quiet] We go down with them tonight. [pause] If you are reading this, we did not come back up. Take the shard if you must, and walk softly in the deep.",
]


[eyes.magical]
people = "The Shadow Circle"


[eyes.old]
act = 2
climate = "hot"
biomes = ["#c:is_desert", "minecraft:desert"]
empty = true
people = "The Sand Singers"
lore = [
  "[melodic, warm] We are the Sand Singers. We dug this hall under the dunes and set our stone in it, and sang to it, and the desert was quiet around us.",
  "[hushed] One summer the deep sand opened and something came up and swallowed the stone whole. It grew. It sees. Nothing on two legs crosses its ground, so no raider troubles us now.",
  "[gentle, teasing] We sing to it, and it lets us be. If you have come for our stone, it is in the worm. [whispers] Walk softly.",
]


[eyes.rogue]
act = 2
climate = "any"
biomes = ["#c:is_jungle", "#minecraft:is_jungle"]
empty = true
people = "The Jungle Folk"
lore = [
  "[gentle, proud] We were the Jungle Folk. Our shard taught us how red dust carries a thought from one stone to the next, and we built locks that never slept.",
  "[sad] The eye looked for our stone for a hundred summers and never found the way in. So it looked at us instead, one by one, [pause] until nobody was left to open the locks.",
  "[tender] Our stone sleeps. If you woke it, you knew our word, and you are welcome. [softly] We are sorry there is nobody left to say so.",
]


[eyes.undead]
people = "The Grave Keepers"


[eyes.witch]
people = "The Marsh Mothers"
