name: Pages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Lay out each major's newest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir site
          gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --exclude-drafts --json tagName --jq '.[].tagName' \
            | grep --extended-regexp '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort --version-sort > tags
          for major in $(sed --regexp-extended 's/^v([0-9]+)\..*/\1/' tags | sort --numeric-sort --unique); do
            tag=$(grep --extended-regexp "^v${major}\." tags | tail --lines 1)
            version=${tag#v}
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "assets/$major" \
              --pattern "Wayfarer-${version}-pack.zip" --pattern "Wayfarer-${major}.zip"
            mkdir --parents "site/$major"
            unzip -q "assets/$major/Wayfarer-${version}-pack.zip" -d "site/$major"
            cp "assets/$major/Wayfarer-${major}.zip" "site/$major/Wayfarer.zip"
          done
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
