issueTrackerURL = "https://github.com/roman-16/wayfarer/issues"
license = "${mod_license}"
loaderVersion = "${loader_version_range}"
modLoader = "javafml"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
description = '''
The rules of the Wayfarer modpack: the ember compass, the eye halls, the Dragon's Gaze and the road that never lets you settle.
'''

[modproperties.${mod_id}]
"sodium:config_api_user" = "io.github.roman16.wayfarer.client.VideoSettings"

[[mixins]]
config = "${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
