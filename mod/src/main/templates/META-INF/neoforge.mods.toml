modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
description = '''
The rules of the Wayfarer modpack: the ember compass, the eye shrines, the Dragon's Gaze and the road that never lets you settle.
'''

[[mixins]]
config = "${mod_id}.mixins.json"

