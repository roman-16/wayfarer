plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    dev {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    devCompileOnly.extendsFrom compileOnly
    devImplementation.extendsFrom implementation
    vineflower
}

repositories {
    maven {
        name = 'Architectury'
        url = 'https://maven.architectury.dev'
        content { includeGroup 'dev.architectury' }
    }
    maven {
        name = 'Curios'
        url = 'https://maven.theillusivec4.top'
        content { includeGroup 'top.theillusivec4.curios' }
    }
    maven {
        name = 'FTB'
        url = 'https://maven.ftb.dev/releases'
        content { includeGroup 'dev.ftb.mods' }
    }
    maven {
        name = 'JourneyMap'
        url = 'https://jm.gserv.me/repository/maven-public/'
        content { includeGroup 'info.journeymap' }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    mavenCentral {
        content { includeGroup 'org.vineflower' }
    }
}

static List<String> swappable(String port) {
    ['-XX:+AllowEnhancedClassRedefinition', "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=127.0.0.1:${port}".toString()]
}

neoForge {
    version = neo_version
    addModdingDependenciesTo sourceSets.dev

    parchment {
        mappingsVersion = parchment_mappings_version
        minecraftVersion = parchment_minecraft_version
    }

    runs {
        configureEach {
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        [play: false, showroom: true].each { name, showroom ->
            create(name) {
                client()
                gameDirectory = file('../build/client')
                jvmArgument '-Xmx8G'
                jvmArguments.addAll swappable(client_swap_port)
                programArguments.addAll '--height', '720', '--username', 'Wayfarer', '--width', '1280'
                sourceSet = sourceSets.dev
                systemProperty "${mod_id}.showroom", showroom.toString()
                systemProperty "${mod_id}.lean", providers.environmentVariable('WAYFARER_LEAN').orElse('false').get()
                ['DISPLAY', 'XDG_SESSION_TYPE', '__GLX_VENDOR_LIBRARY_NAME'].each { variable ->
                    String value = providers.environmentVariable(variable).orNull
                    if (value != null) {
                        environment.put(variable, value)
                    }
                }
            }
        }
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.dev
        }
        server {
            server()
            gameDirectory = file('../build/devserver')
            jvmArgument '-Xmx8G'
            jvmArguments.addAll swappable(server_swap_port)
            programArguments.add '--nogui'
            sourceSet = sourceSets.dev
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.dev)
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

sourceSets.dev.resources {
    srcDir 'src/generated/dev'
}

dependencies {
    compileOnly "maven.modrinth:endrem:${endrem_version}"
    compileOnly "maven.modrinth:lootr:${lootr_version}"
    compileOnly "maven.modrinth:the-hordes:${hordes_version}"
    implementation "dev.architectury:architectury-neoforge:${architectury_version}"
    implementation "dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}"
    implementation "dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}"
    implementation "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    devCompileOnly "info.journeymap:journeymap-api-neoforge:${journeymap_api_version}"
    devCompileOnly "maven.modrinth:easy-npc-core:${easy_npc_version}"
    devCompileOnly "maven.modrinth:gravestone-mod:${gravestone_version}"
    devCompileOnly "maven.modrinth:journeymap:${journeymap_version}"
    vineflower "org.vineflower:vineflower:${vineflower_version}"
}

tasks.matching { it.name == 'runServer' }.configureEach {
    standardInput = System.in
}

tasks.register('vineflower', Sync) {
    from configurations.vineflower
    into layout.buildDirectory.dir('vineflower')
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            curios_version_range      : curios_version_range,
            ftb_teams_version_range   : ftb_teams_version_range,
            loader_version_range      : loader_version_range,
            minecraft_version_range   : minecraft_version_range,
            mod_id                    : mod_id,
            mod_license               : mod_license,
            mod_name                  : mod_name,
            mod_version               : mod_version,
            neo_version               : neo_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

processResources {
    from(rootProject.file('../balance.toml')) {
        into 'wayfarer'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:all' << '-Xlint:-classfile' << '-Werror'
}
