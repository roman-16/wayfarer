plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

def heapGigabytes = (providers.fileContents(layout.projectDirectory.file('../balance.toml')).asText.get() =~ /(?ms)^\[heap\]\s*^gigabytes = (\d+)$/)[0][1]
def processors = providers.environmentVariable('WAYFARER_PROCESSORS').orNull

sourceSets {
    dev {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    devCompileOnly.extendsFrom compileOnly
    devImplementation.extendsFrom implementation
    hotswapAgent {
        transitive = false
    }
    vineflower
}

repositories {
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven {
        name = 'Commoble'
        url = 'https://maven.commoble.net'
        content { includeGroup 'net.commoble.infiniverse' }
    }
    maven {
        name = 'Curios'
        url = 'https://maven.theillusivec4.top'
        content { includeGroup 'top.theillusivec4.curios' }
    }
    maven {
        name = 'JourneyMap'
        url = 'https://jm.gserv.me/repository/maven-public/'
        content { includeGroup 'info.journeymap' }
    }
    maven {
        name = 'CaffeineMC'
        url = 'https://maven.caffeinemc.net/releases'
        content { includeGroup 'net.caffeinemc' }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    ivy {
        name = 'Baritone'
        url = 'https://github.com/cabaletta/baritone/releases/download'
        patternLayout { artifact 'v[revision]/[module]-[revision].[ext]' }
        metadataSources { artifact() }
        content { includeGroup 'cabaletta' }
    }
    mavenCentral {
        content {
            includeGroup 'org.hotswapagent'
            includeGroup 'org.vineflower'
        }
    }
}

static List<String> swappable(String port) {
    ['-XX:+AllowEnhancedClassRedefinition', '-XX:HotswapAgent=external', "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=127.0.0.1:${port}".toString()]
}

Provider<String> hotswapAgentArgument = configurations.hotswapAgent.elements.map { files -> "-javaagent:${files.first().asFile}".toString() }

neoForge {
    version = neo_version
    addModdingDependenciesTo sourceSets.dev

    parchment {
        mappingsVersion = parchment_mappings_version
        minecraftVersion = parchment_minecraft_version
    }

    runs {
        configureEach {
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            if (processors != null) {
                jvmArgument "-XX:ActiveProcessorCount=${processors}"
            }
        }
        [play: false, showroom: true].each { name, showroom ->
            create(name) {
                client()
                gameDirectory = file('../build/client')
                jvmArgument "-Xmx${heapGigabytes}G"
                jvmArguments.addAll swappable(client_swap_port)
                jvmArguments.add hotswapAgentArgument
                programArguments.addAll '--fml.mixinConfig', "${mod_id}.dev.mixins.json", '--height', '720', '--username', 'Wayfarer', '--width', '1280'
                sourceSet = sourceSets.dev
                systemProperty "${mod_id}.background", providers.environmentVariable('WAYFARER_BACKGROUND').orElse('false').get()
                systemProperty "${mod_id}.showroom", showroom.toString()
                systemProperty "${mod_id}.lean", providers.environmentVariable('WAYFARER_LEAN').orElse('false').get()
                systemProperty "${mod_id}.seed", providers.environmentVariable('WAYFARER_SEED').orElse('').get()
                systemProperty "${mod_id}.state", providers.environmentVariable('WAYFARER_STATE').orElse('').get()
                systemProperty "${mod_id}.state.cache", providers.environmentVariable('WAYFARER_STATE_CACHE').orElse('').get()
                systemProperty "${mod_id}.world", providers.environmentVariable('WAYFARER_WORLD').orElse('').get()
                ['DISPLAY', 'XDG_SESSION_TYPE'].each { variable ->
                    String value = providers.environmentVariable(variable).orNull
                    if (value != null) {
                        environment.put(variable, value)
                    }
                }
            }
        }
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.dev
        }
        server {
            server()
            gameDirectory = file('../build/devserver')
            jvmArgument "-Xmx${heapGigabytes}G"
            jvmArguments.addAll swappable(server_swap_port)
            jvmArguments.add hotswapAgentArgument
            programArguments.add '--nogui'
            sourceSet = sourceSets.dev
            systemProperty "${mod_id}.background", providers.environmentVariable('WAYFARER_BACKGROUND').orElse('false').get()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.dev)
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

sourceSets.dev.resources {
    srcDir 'src/generated/dev'
}

dependencies {
    compileOnly "curse.maven:inventory-sorter-240633:${inventory_sorter_version}"
    compileOnly "curse.maven:nomadic-tents-238794:${nomadic_tents_version}"
    compileOnly "info.journeymap:journeymap-api-neoforge:${journeymap_api_version}"
    compileOnly "maven.modrinth:balm:${balm_version}"
    compileOnly "maven.modrinth:combat-roll:${combat_roll_version}"
    compileOnly "maven.modrinth:distanthorizons:${distant_horizons_version}"
    compileOnly "maven.modrinth:endrem:${endrem_version}"
    compileOnly "maven.modrinth:geckolib:${geckolib_version}"
    compileOnly "maven.modrinth:gravestone-mod:${gravestone_version}"
    compileOnly "maven.modrinth:invmove:${invmove_version}"
    compileOnly "maven.modrinth:iris:${iris_version}"
    compileOnly "maven.modrinth:jade:${jade_version}"
    compileOnly "maven.modrinth:jei:${jei_version}"
    compileOnly "maven.modrinth:journeymap:${journeymap_version}"
    compileOnly "maven.modrinth:lootr:${lootr_version}"
    compileOnly "maven.modrinth:pick-up-notifier:${pick_up_notifier_version}"
    compileOnly "maven.modrinth:silent-gear:${silent_gear_version}"
    compileOnly "maven.modrinth:silent-lib:${silent_lib_version}"
    compileOnly "maven.modrinth:simple-voice-chat:${voicechat_version}"
    compileOnly "maven.modrinth:sophisticated-core:${sophisticated_core_version}"
    compileOnly "maven.modrinth:the-hordes:${hordes_version}"
    compileOnly "maven.modrinth:tough-as-nails:${tough_as_nails_version}"
    compileOnly "maven.modrinth:waystones:${waystones_version}"
    compileOnly "net.caffeinemc:sodium-neoforge-mod:${sodium_version}"
    implementation "maven.modrinth:easy-npc-core:${easy_npc_version}"
    implementation "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    jarJar(implementation("net.commoble.infiniverse:infiniverse-1.21")) {
        version {
            strictly "[${infiniverse_version},)"
            prefer infiniverse_version
        }
    }
    devCompileOnly "cabaletta:baritone-api-neoforge:${baritone_version}"
    hotswapAgent "org.hotswapagent:hotswap-agent-core:${hotswap_agent_version}"
    vineflower "org.vineflower:vineflower:${vineflower_version}"
}

tasks.matching { it.name == 'runServer' }.configureEach {
    standardInput = System.in
}

tasks.register('vineflower', Sync) {
    from configurations.vineflower
    into layout.buildDirectory.dir('vineflower')
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            curios_version_range      : curios_version_range,
            loader_version_range      : loader_version_range,
            minecraft_version_range   : minecraft_version_range,
            mod_id                    : mod_id,
            mod_license               : mod_license,
            mod_name                  : mod_name,
            mod_version               : mod_version,
            neo_version               : neo_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

processResources {
    from(rootProject.file('../balance.toml')) {
        into 'wayfarer'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:all' << '-Xlint:-classfile' << '-Werror'
}
