opens = { claimed = "ash/evening" }

[forge]
already = "[gruff, amused] It's frost iron already."
book_no_hammer = "[admiring, then rueful] Pretty book. Putting it on a tool needs a sound hammer, and mine's been cracked since the fire."
book_wont = "[gruff] It won't take what's in that book."
give = "[trusting] Leave it with Hob."
half = "[gruff] More than half whole. This hammer does no better. Bring it back when it's worn."
here = "[proud, gruff] Here. Mind the edge."
keep = "[casual] Keep it for now."
kept = "[shrugs] Suit yourself. You know where I sit."
leave = "[helpful] Want me to see to it? You'll have it back at the next fire."
leave_half = "[rueful] Want me to see to it? Halfway is the best this hammer does. You'll have it back at the next fire."
lumps = { axe = 3, boots = 4, chestplate = 8, helmet = 5, hoe = 2, leggings = 7, pickaxe = 3, shovel = 1, sword = 2 }
no_hammer = "[grumbling] Not till I have a hammer for it."
not_mine = "[patient] That's not mine to make again. Hold it out with nothing in your other hand, and I'll mend it."
not_yet = "[gruff] Not till the fire."
numbers = ["none", "one", "two", "three", "four", "five", "six", "seven", "eight"]
short = "[counting, gruff] {wants} {need}. You've {have}."
taken = "[brisk] Right. Off you go."
whole = "[gruff] It's whole. Nothing for me to do."
wants = { axe = "An axe needs", boots = "Boots need", chestplate = "A chestplate needs", helmet = "A helmet needs", hoe = "A hoe needs", leggings = "Leggings need", pickaxe = "A pickaxe needs", shovel = "A shovel needs", sword = "A sword needs" }

[[lines]]
after = "the_lost_ore"
by = "hob"
carries = "minecraft:enchanted_book"
id = "hob_book"
text = "[interested] A book? Hold the piece out to me with the book in your other hand. I'll have it set by morning."

[[lines]]
before = "the_lost_ore"
by = "hob"
carries = "minecraft:enchanted_book"
id = "hob_book_cracked"
text = "[interested, then rueful] A book? I can put its enchantment onto a tool or armour, overnight. Not with this cracked hammer, though."

[[lines]]
by = "maud"
carries = "sophisticatedbackpacks:gold_backpack"
id = "maud_diamonds"
text = "[practical] A bigger pack than that needs diamonds, and the open stone has none. Old mines have them, [dry] and the deep dark, if you dare go down."

[[lines]]
by = "hob"
id = "hob_dark"
text = "[gruff, practical] A torch in your fist is a hand you can't swing with. Iron round the flame and a hook on your belt, and you've both hands back."
when = ["dark/torch"]

[[lines]]
by = "hob"
id = "hob_metal"
text = "[wistful] Iron's good. But the Frost Walkers had a metal that never rusts and doesn't mind the cold. I've never seen it worked."
when = ["armour/iron", "tools/iron", "weapons/hobs_blade"]

[[lines]]
by = "agna"
id = "agna_cold"
text = "[practical] Wool keeps you alive. The Frost Walkers walked on snow as if it were a road. They made shoes for it."
when = ["cold/wool"]

[[lines]]
by = "agna"
id = "agna_heat"
text = "[practical] Leaves keep the sun off. The Sand Singers live where nothing else can, and they know how."
when = ["heat/leaves"]

