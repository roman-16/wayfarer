[cues.ember_given]
layers = [
  { event = "minecraft:block.amethyst_block.resonate", pitch = 0.75 },
  { event = "minecraft:block.respawn_anchor.charge", pitch = 0.625, volume = 0.625 },
]

[cues.ember_wakes]
layers = [
  { delay = 8, event = "minecraft:block.beacon.activate", pitch = 1.25, volume = 0.75 },
  { event = "minecraft:item.firecharge.use", pitch = 0.625, volume = 0.5 },
]

[cues.reward_taken]
layers = [
  { event = "minecraft:entity.item.pickup", pitch = 0.75, volume = 0.625 },
  { event = "minecraft:item.bundle.insert" },
]

[cues.shard_taken]
layers = [
  { delay = 8, event = "minecraft:block.conduit.activate", volume = 0.75 },
  { event = "minecraft:block.end_portal_frame.fill", pitch = 0.75 },
]

