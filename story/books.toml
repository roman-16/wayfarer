[[found]]
author = "Wend"
id = "wend/ledger"
pages = [
  "The swamp's hall, under the black pool. The snow hall, the stair, twenty winters gone. The old green, empty. The bay: two, and they bow. The red canyons, empty.",
  "The sands: in the worm. The jungle: locked, and the boy has the maps now. The grasslands: under the seal. The dark wood: here, on my own stand.",
  "The girl. Maren. Mine now.",
]
title = "His Ledger"

[[found]]
author = "A Keeper"
id = "keepers/wend"
pages = [
  "The finder came to our door again tonight. His ember is the size of a pea. He asked to stay one winter, only one, and said he was tired.",
  "We told him what we tell them all: a Wayfarer who stops is a door left open. He said we were a door shut. He cursed us, and the oath, and the road.",
  "He walked off towards the grey coats' fires. Seal this, and pray we were right.",
]
title = "A Keeper's Note"

[[found]]
author = "Morwen"
id = "tide/remedy"
pages = [
  "For the healer of your caravan. Bladderwrack and salt, steeped a night in the water of our bay. Drink it warm.",
  "It breaks the marsh fever. It does one thing more: for a day, whatever looks for you looks past you. We use it on the boats. Use it well.",
]
title = "The Tide Folk's Remedy"

[[found]]
author = "The Jungle Folk"
id = "jungle/prayer"
pages = [
  "Sleep, little locks. Sleep, and keep what is ours.\n\nSleep through the rain and the root and the years. Sleep through every hand that is not ours.",
  "Our stone sleeps while you sleep. Let it sleep until our children come home.\n\nOnly the word our children knew will rouse you, and our children knew one word before all others: WAKE.",
]
title = "The Jungle Folk's Prayer"

[[found]]
author = "M."
id = "maren/note"
pages = ["For whoever carries his light now.\n\nEat. It is a long road on an empty stomach.\n\n- M."]
title = "A Note"

[[found]]
author = "A Wayfarer"
id = "cache/journal"
pages = [
  "Autumn. Found the valley today: water, birch, a south slope. The ember brightened at the pond. One winter. I'll build a cabin for one winter.",
  "The cabin stands. I sleep in a bed for the first time since I was a child. The ember is quieter. It's resting, I think. We've walked a long way.",
  "Spring. I meant to go. The roof wanted mending, and then the garden. The ember is the size of a pea. It doesn't warm my hand any more.",
  "Second winter. Something scratched at the door last night and went away. It came back the next night. I keep the fire high.",
  "One more winter here. The ember is so small now. I'll walk in spring.",
]
title = "A Journal"

[[found]]
author = "A young Wayfarer"
id = "wend/first_camp"
pages = [
  "First night on my own road. I own a tent, a mallet and a fire, and I have never been this happy. Tomorrow I walk until the ember gutters, then I turn.",
  "Whoever finds this: the road gives more than it takes. Eat what it gives, keep your fire small, and never stay where they are kind to you for long.",
]
title = "A Young Man's Page"

[[found]]
author = "An old Wayfarer"
id = "wend/last_camp"
pages = [
  "I stopped walking here. My feet hurt and the road was long, and the men in grass cloaks were kind.",
  "They left bread by my fire. I ate it. Tomorrow I will walk on. I wrote that yesterday too.",
]
title = "The Last Page"

[[found]]
author = "Maren"
id = "maren/unsent"
pages = [
  "Captain Wend. I know you cannot read this. I write it anyway, the way you taught me to talk to the fire.",
  "The one you chose is walking. The captains have me follow the smoke for them. You chose well: they stopped for a dying man when nobody else would. I have not decided what that means.",
]
title = "A Letter Never Sent"

[[found]]
author = "The Gazebound"
id = "gazebound/ledger"
pages = [
  "Captain Wend, taken in at the grass halls in the first winter. Eats well. Asks for nothing. Walks the halls at night as if they were a road.",
  "Ninth winter: the captain's ember went dark. He hears nothing in it now. We keep him anyway, for the day it can be passed.",
  "Twentieth winter: the captain is old. The captains agree: let him light his fire by the road, and follow whoever he gives it to.",
]
title = "The Captain's Ledger"

[[found]]
author = "Wend"
id = "wend/letter"
pages = [
  "For Maren. Open it at the gate.",
  "Watch the smoke, Maren. Someone kind is carrying my ember to the gate. Help them finish it, then go and build a home.",
]
title = "For Maren"

[[found]]
author = "The Keepers"
id = "keepers/breaking"
pages = [
  "The Eye sat in the portal between the worlds, and through it the dragon watched everything that stood still. Where it looked, its creatures came. That is how the deep cities fell.",
  "Those who lived tore the Eye out of the portal, and the dragon went blind. They meant to destroy it. Fire, the sea and the hammer could only break it.",
  "Whole, it would sit in any frame again. So they broke it in twelve, and sent each shard to one of twelve peoples at the far ends of the world, to hide.",
  "Its light came loose when it broke. Those who carried it walked, and swore it: never settle, never shine, everything carried. We call them Wayfarers.",
  "Note for the reader. A frame takes whatever of the Eye it is brought. One shard or twelve, it closes the same. Do not let anyone tell you otherwise.",
]
title = "The Breaking"

[[found]]
author = "A Gazebound captain"
id = "gazebound/orders_1"
pages = [
  "By the heir's word, to every outpost on the south roads. Watch for smoke where no village stands. A Wayfarer's fire is small, and burns each night in a new place.",
  "Do not fight whoever carries one. Do not let them see you follow. Feed them. A light that is fed walks further.",
]
title = "Captain's Orders, I"

[[found]]
author = "A shipwright"
id = "shipwright/log"
pages = [
  "Day 1. Pushed off at dusk on the tide. Edda didn't come down to the water. She'll be on the jetty when I'm back.",
  "Day 3. No land in any direction. Something knocked the hull in the night, twice. A log, I tell myself. Logs don't knock twice.",
  "Day 6. I keep the lamp hooded after dark. Whatever knocks comes when it sees a light.",
  "Day 9. Land. A bay where they fish by night and nothing comes for them. Their boats go out with lamps lit, and the water lies flat as a floor.",
  "Day 11. They gave me water and dried fish, and a name for their bay I can't spell. Turning home tomorrow.",
  "Day 14. Halfway, by the stars. It's back. It follows the lamp, so the lamp's out. It follows anyway. Tell Edda",
]
title = "A Shipwright's Log"

[[found]]
author = "A Gazebound captain"
id = "gazebound/orders_2"
pages = [
  "The finder's ember is dark, and he walks no more. We keep him at the grass halls for the day it can be passed.",
  "Our hope is whoever he passes it to. When the old man lights his last fire, follow the one who leaves it.",
]
title = "Captain's Orders, II"

[[found]]
author = "A Gazebound captain"
id = "gazebound/orders_3"
pages = [
  "A carrier who trusts us walks faster than one who fears us. Let the swamp women and the snow folk think the worst of us. It costs us nothing.",
  "Leave bread where the carrier sleeps. Take nothing from them. Every shard they lift is one we could never lift ourselves.",
]
title = "Captain's Orders, III"

[[found]]
author = "An archivist of the deep city"
id = "first_gate/last_record"
pages = [
  "I write this by the gate, because the gate is the only thing in the city still making a sound. It hums, very low, the note it made the day it opened.",
  "What came through was not the dragon's. The dragon only watches. This wants nothing watched, nothing moving, nothing at all. It is patient. It has all the time there is.",
  "If you came down here carrying a light, keep walking. Everything that stops, it finds.",
]
title = "The Last Record"

[[found]]
author = "A Gazebound captain"
id = "gazebound/orders_4"
pages = [
  "To the outposts beyond the sea. The carrier has crossed. Keep to the far shore, and let them find the halls before you do.",
  "Wherever they lift a shard, be there the morning after. Take nothing. Leave nothing but bread.",
]
title = "Captain's Orders, IV"

[[found]]
author = "A Gazebound captain"
id = "gazebound/orders_5"
pages = [
  "The heir rides to the jungle halls himself. Whatever the carrier cannot open, he will stand beside them and wait.",
  "Keep close to their camp, and closer when the moon turns. So it was written in the old captain's own hand, and his page is kept at his house in the dark wood.",
]
title = "Captain's Orders, V"

[[found]]
author = "M."
id = "maren/bundle"
pages = ["Across the sea already. He'd have been proud of you, the old fool.\n\nEat something warm tonight.\n\n- M."]
title = "A Note"

[[found]]
author = "M."
id = "maren/last"
pages = ["You fly now. I never could keep up with him either.\n\nEat. He never ate enough either.\n\n- M."]
title = "The Last Note"

[[found]]
author = "Wend"
id = "wend/orders"
pages = [
  "To the heir. Do not chase the one who carries it. Feed them, and let them walk. The ember pulls to the halls, and a light that is fed walks further.",
  "Let the peoples think the worst of us. Fear sends a carrier on; trust makes them stop and talk.",
  "When the last shard is lifted, wait at the frame. They will open it, because they will think it is theirs to open. I will not be there. Find someone to carry it.",
]
title = "Orders, in His Hand"

[[collections]]
author = "The Keepers"
chance = 0.6
id = "keepers"
targets = ["betterstrongholds:chests/grand_library", "betterstrongholds:chests/library_md"]

[[collections.books]]
id = "keepers/first_watch"
pages = [
  "Year one of the watch. We built this hall as far from everyone as our legs could carry the stone. The gate sleeps below us. It is only a frame now, and we mean to keep it that way.",
  "Rule of the watch: no Keeper lights a fire bigger than a hand. No Keeper plants what takes more than a season to grow. We are the only people in the world allowed to stay, and we must stay small.",
  "If you are reading this, the watch has ended or the Eye is coming home. Either way, you are welcome at our table. There is not much left on it.",
]
title = "The First Watch"

[[collections.books]]
id = "keepers/distance"
pages = [
  "Why so far? Because the gaze sees what stays still, and a gate stays stiller than anything. We carried this one out past the edge of every map, so that whatever it shone, it shone on nobody.",
  "Twelve halls like this one stand in a ring, all the same distance from where the first fire was lit, and every one of them guards a gate. The ember will lead you to the nearest.",
  "Do not blame us for the walk. Every step between you and home is a step between home and the dragon.",
]
title = "On the Distance of the Gate"

[[collections.books]]
id = "keepers/last_keeper"
pages = [
  "The last entry. The others have gone down to sleep with the old Keepers. I stay to write, because someone should.",
  "Years ago a Wayfarer came to our door, the only one in my lifetime. His ember was dim, and he wore the grass crown of the Gazebound under his cloak. He asked where the twelve shrines lie. No Wayfarer asks that.",
  "We sent him away. If he found someone to carry what he could not, and it is you: do not open this gate for them. Open it for yourself, finish it, and then go home.",
]
title = "The Last Keeper"

[[collections]]
author = "An archivist of the deep city"
chance = 0.5
id = "first_gate"
targets = ["minecraft:chests/ancient_city"]

[[collections.books]]
id = "first_gate/bright_years"
pages = [
  "We were the brightest city the world had ever seen, and we were proud of it. Our lamps burned day and night. We did not know that every lamp was a word shouted at the sky.",
  "Then the dragon looked. Not at a traveller, not at a village. At us. The light went cold in the streets, and the first of us stopped moving where they stood.",
]
title = "Record of the Bright Years"

[[collections.books]]
id = "first_gate/gate_we_built"
pages = [
  "Our masters found power in the burning world below and built a gate of our own, to strike back through the dark. You have seen its frame at the heart of the city.",
  "It opened once. What came through was silence, and the silence spread across the stone like moss. We call it sculk now. It remembers every sound we ever made.",
  "Do not wake the guard. It is the last of us, and it no longer knows friend from enemy. Walk softly, take what you need, and leave us to the quiet.",
]
title = "The Gate We Built"

[[collections]]
author = "The Gazebound"
chance = 0.4
id = "gazebound"
targets = [
  "minecraft:chests/illager_mansion/library_chest",
  "minecraft:chests/pillager_outpost",
  "nova_structures:chests/illager_hideout_library",
  "nova_structures:chests/pillager_outpost_treasure",
]

[[collections.books]]
id = "gazebound/grass_king"
pages = [
  "Brothers, the Grass King saw what the dragon sees, and for one summer he ruled as a god. Then his people, cowards all, tore the sight from his crown.",
  "We are his heirs. We will finish what he began: gather the twelve shards, open the true gate, and let the dragon see the world again, through our eyes and for our purposes.",
]
title = "The Crown of the Grass King"

[[collections.books]]
id = "gazebound/orders"
pages = [
  "Orders for the captains. The shards are waking and calling to each other. Listen for them in the high places, the dead places, the drowned places.",
  "A Wayfarer is walking again, and gathering for us without knowing it. Do not touch the ember. Let it find what we cannot, and follow its smoke to the gate.",
]
title = "Orders for the Captains"

[[collections.books]]
id = "gazebound/shadow_circle"
pages = [
  "Why do we build our mansions in the dark woods? Because the Shadow Circle built there first. We copied their halls stone by stone, and still their power would not come to us.",
  "They say the burden is the point. They say the shard must be carried, not kept. They are dead, and we are not. Keep searching.",
]
title = "The Halls of the Shadow Circle"
