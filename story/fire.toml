[[scenes]]
id = "dimming"
lines = ["Stay if you need to. I stayed twenty years."]
speaker = "voice"

[[scenes]]
id = "gate_arrival"
lines = ["You brought it all the way. He said you would."]
speaker = "maren"

[[scenes]]
book = "wend/letter"
id = "gate_letter"
lines = [
  "He told me to open this at the gate.",
  "\"Watch the smoke, Maren. Someone kind is carrying my ember to the gate. Help them finish it, then go and build a home.\"",
  "Stand aside, brothers. No? Then stand against me.",
]
speaker = "maren"

[[scenes]]
id = "gate_cleared"
lines = ["Go. Finish it. I'll find a road of my own."]
speaker = "maren"

[[scenes]]
id = "end_arrival"
lines = ["You came. You really came."]
speaker = "voice"

[[scenes]]
id = "last_crystal"
lines = ["Stop. I only wanted to see."]
speaker = "voice"
