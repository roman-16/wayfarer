[villager.acts]
1 = [
  "Strangers bring the burning. One trade, then go.",
  "Keep that light in your pocket while you're in our street.",
  "We were a bigger town once. Then we grew.",
  "Trade's done. Don't linger near the well; people talk.",
]
2 = [
  "Men in grey came asking after a fire that walks. We told them nothing.",
  "One trade. The grey coats count our visitors.",
  "They say someone walks with a fire in their hand again. ...Don't tell me if it's you.",
  "You've come a long way. Go on further; it's safer for us both.",
]
3 = [
  "Banners went by at dawn. Grey ones. Trade quick.",
  "If you're going where I think you're going, take bread. Take two.",
  "Nobody's slept well in weeks. Here. Go.",
  "One trade, then go. And whatever you're doing out there, finish it.",
]
finale = [
  "It's quiet now. Quieter than I remember. Stay for supper, if you like.",
  "My daughter asked about the walking fire. I told her it went home.",
]
prologue = [
  "Strangers bring the burning. One trade, then go.",
  "Keep that light in your pocket while you're in our street.",
]

