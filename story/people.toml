[agna]
color = "green"
evenings = [
  "[firm] Eat what's in the pot. All of it.",
  "[motherly] Take your boots off by the fire. Your feet need the air.",
  "[softly] If you can't sleep, lie still anyway. It helps.",
  "[gently] Drink some water before you lie down.",
]
mornings = [
  "[brisk] Eat something before you go. Then go on; we'll follow.",
