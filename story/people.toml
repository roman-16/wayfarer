[villager.acts]
1 = [
  "[wary, curt] Strangers bring the burning. One trade, then go.",
  "[nervous whisper] Keep that ember in your pocket while you're in our street.",
  "[tired, sad] We were a bigger town once. Then the burning came.",
  "[low, quick] Trade's done. Don't linger near the well; people talk.",
]
2 = [
  "[quietly] Men in grey came asking about someone with a glowing coal. We told them nothing.",
  "[nervous] One trade. The grey coats count our visitors.",
  "[hushed] They say someone walks with a fire in their hand again. [pause] ...Don't tell me if it's you.",
  "[gentle, wary] You've come a long way. Go on further; it's safer for us both.",
]
3 = [
  "[urgent, low] Banners went by at dawn. Grey ones. Trade quick.",
  "[kindly] If you're going where I think you're going, take bread. Take two.",
  "[tired] Nobody's slept well in weeks. Here. Go.",
  "[quiet, earnest] One trade, then go. And whatever you're doing out there, finish it.",
]
finale = [
  "[warm, wondering] It's quiet now. Quieter than I remember. Stay for supper, if you like.",
  "[softly, fond] My daughter asked about the walking fire. I told her it went home.",
]
prologue = [
  "[wary, curt] Strangers bring the burning. One trade, then go.",
  "[nervous whisper] Keep that ember in your pocket while you're in our street.",
]

