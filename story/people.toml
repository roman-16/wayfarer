]
unnamed = "A woman in green"
welcomes = [
  "[relieved] Back in one piece. [brisk] Sit, let me look at you.",
  "[warm] There you are. Eat before you do anything else.",
  "[brisk] Show me your hands. [pause] ...Fine. Go and get warm.",
  "[tutting] Sit before you fall down. Then tell me where it hurts.",
]

