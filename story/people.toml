[agna]
color = "green"
mornings = [
  "Eat something before you go. Then go on; we'll follow.",
  "Go. I'll keep the child from running after you.",
  "Drink before you walk, not after. Go on.",
  "If you cut yourself today, wash it. Then walk.",
]
name = "Agna"
remarks = [
  "Eat something. You look like a ghost.",
  "If it hurts, show me. If it doesn't, walk.",
]
unnamed = "A woman in green"
welcomes = [
  "Back in one piece. Sit, let me look at you.",
  "There you are. Eat before you do anything else.",
  "Show me your hands. ...Fine. Go and get warm.",
  "Sit before you fall down. Then tell me where it hurts.",
]

[alruna]
color = "blue"
mornings = [
  "I'll walk with the wagons. My feet aren't used to this yet.",
  "Go on. I'm writing down yesterday before I lose it.",
  "Go on. I'll ask you everything tonight.",
  "Walk carefully. I've only just started writing you down.",
]
name = "Alruna"
remarks = [
  "Master Ansel copied that book three times. I can still smell the smoke on it.",
  "Everything the Keepers wrote down, and none of them ever walked this far.",
]
unnamed = "A young woman in grey"
welcomes = [
  "You're back. Tell me where you went. Slowly.",
  "I saved you a seat. And a page.",
  "Sit down before you forget it. Whatever it was.",
  "There's room by the fire. You talk; I'll write.",
]

