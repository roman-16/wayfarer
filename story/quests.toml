title = "The Last Wayfarer's Journal"

[[chapters]]
icon = "minecraft:campfire"
id = "oath"
subtitle = ["Never settle. Never stay. Carry the ember."]
title = "The Oath"

[[chapters.quests]]
description = [
  "You sat at my fire when nobody else would, so the ember is yours now. I could not carry it one more day.",
  "Read my journal at the lectern, then take what I leave you: my tent, my mallet and my bedroll.",
]
icon = "minecraft:writable_book"
id = "last_fire"
rewards = [
  { item = "nomadictents:tiny_yurt" },
  { components = { "minecraft:custom_name" = "\"Wayfarer's Mallet\"", "minecraft:unbreakable" = {} }, item = "nomadictents:golden_mallet" },
  { item = "comforts:sleeping_bag_brown" },
]
subtitle = "A stranger's fire, a stranger's ember"
tasks = [{ checkmark = true }]
title = "The Last Fire"
x = 0.0
y = 0.0

[[chapters.quests]]
after = ["last_fire"]
description = [
  "A Wayfarer tent is folded space, and the gaze cannot see what is not anywhere. One blow of the mallet raises it.",
  "Pitch your tent before dark and sleep inside it.",
]
icon = "nomadictents:tiny_yurt"
id = "tent"
rewards = [{ count = 6, item = "minecraft:bread" }]
subtitle = "Safe, because it is nowhere"
tasks = [{ advancement = "wayfarer:nowhere" }]
title = "A Roof That Is Nowhere"
x = -2.25
y = 1.5

[[chapters.quests]]
after = ["last_fire"]
description = [
  "A Wayfarer owns only what they can carry, and leaves the rest for the next traveller.",
  "Make a backpack and wear it on your back.",
]
id = "backpack"
rewards = [{ xp_levels = 3 }]
subtitle = "Everything you own, on your back"
tasks = [{ item = "sophisticatedbackpacks:backpack" }]
title = "Carry What You Own"
x = -0.75
y = 1.5

[[chapters.quests]]
after = ["last_fire"]
description = [
  "The ember is bound to fire: wherever you light one, it brings you back when you fall. The gaze's creatures cannot bear its light, so on an ordinary night none is born within twelve blocks of it, none steps closer, and none goes for you while you stand there.",
  "Make a campfire, light it where you rest, and stand still beside it for half a minute. The ember warms, and until tomorrow's dusk it burns the fire instead of your food.",
]
id = "campfire"
rewards = [{ count = 4, item = "minecraft:cooked_beef" }]
subtitle = "Where the ember brings you back"
tasks = [{ item = "minecraft:campfire" }]
title = "Keep a Fire"
x = 0.75
y = 1.5

[[chapters.quests]]
after = ["last_fire"]
description = [
  "The ember burns what you eat, twice what a settled stomach would. The more kinds of food you eat, the stronger it keeps you.",
  "Eat something you have not eaten on this road yet; its tooltip tells you when a food is new to you.",
]
icon = "minecraft:baked_potato"
id = "food"
rewards = [{ count = 4, item = "minecraft:apple" }, { count = 4, item = "minecraft:baked_potato" }]
subtitle = "Eat the road"
tasks = [{ checkmark = true }]
title = "Eat What the Road Gives"
x = 2.25
y = 1.5

[[chapters.quests]]
after = ["last_fire"]
description = [
  "When you share a fire, the ember splits. Everyone on a team carries every shard any of you takes, and hears the fire together.",
  "Travel with friends by joining one team with the team button at the top left of the inventory screen, or walk alone.",
]
icon = "minecraft:soul_campfire"
id = "share"
rewards = [{ xp_levels = 1 }]
subtitle = "The ember splits"
tasks = [{ checkmark = true }]
title = "Share a Fire"
x = 0.75
y = 3.0

[[chapters.quests]]
after = ["backpack"]
description = [
  "Roads are the only thing a Wayfarer leaves behind.",
  "Make an atlas and let it remember where you have been.",
]
id = "atlas"
rewards = [{ count = 16, item = "minecraft:paper" }]
subtitle = "The only thing we leave behind"
tasks = [{ item = "map_atlases:atlas" }]
title = "Map the Road"
x = -0.75
y = 3.0

[[chapters.quests]]
after = ["atlas", "campfire", "tent"]
description = [
  "You have lived a Wayfarer's first day, and the ember answers. Look to the top of your sight: a compass that turns with you. Far from a shard, the ember only flares when you walk towards it and gutters when you walk away.",
  "Within five hundred blocks the shard itself appears on the compass, at the stair down to its shrine. The Twelve Peoples hid every stair under a cover that looks like nothing to anyone without an ember. Walk until it answers.",
]
icon = "minecraft:blaze_powder"
id = "ember"
rewards = [{ auto = "invisible", command = "/wayfarer ember {p}" }]
subtitle = "Flaring, guttering"
tasks = [{ stat = "minecraft:play_time", value = 1 }]
title = "The Ember Wakes"
x = 0.0
y = 4.5

[[chapters]]
icon = "simplyswords:iron_longsword"
id = "road"
subtitle = ["Everything here fits on a Wayfarer's back."]
title = "The Road Provides"

[[chapters.quests]]
after = ["last_fire"]
description = [
  "The road is long, and not everything on it is friendly. A longer blade keeps it at arm's length.",
  "Forge an iron longsword.",
]
id = "blade"
rewards = [{ xp_levels = 3 }]
subtitle = "Arm's length"
tasks = [{ item = "simplyswords:iron_longsword" }]
title = "A Better Blade"
x = -1.5
y = 0.0

[[chapters.quests]]
after = ["last_fire"]
description = [
  "Every fourth night nothing shelters you but what you carry. Carry a shield.",
  "Make an iron heater shield.",
]
id = "shield"
rewards = [{ xp_levels = 3 }]
subtitle = "For the nights no tent opens"
tasks = [{ item = "magistuarmory:iron_heatershield" }]
title = "A Shield on Your Arm"
x = 0.0
y = 0.0

[[chapters.quests]]
after = ["last_fire"]
description = [
  "The hordes find you on the nights the gaze turns. Meet them in iron.",
  "Make an iron chestplate.",
]
id = "armor"
rewards = [{ xp_levels = 3 }]
subtitle = "Meet them in iron"
tasks = [{ item = "minecraft:iron_chestplate" }]
title = "Iron on Your Back"
x = 1.5
y = 0.0

[[chapters.quests]]
after = ["last_fire"]
description = [
  "The ember finds shards, not lands. Each people hid its shard in its own land, and this compass finds lands.",
  "Make a Nature's Compass.",
]
id = "biomes"
rewards = [{ xp_levels = 3 }]
subtitle = "Where each people lived"
tasks = [{ item = "naturescompass:naturescompass" }]
title = "The Land's Own Compass"
x = -1.5
y = 1.5

[[chapters.quests]]
after = ["last_fire"]
description = [
  "Cliffs and ravines cost a Wayfarer days. A hook costs seconds.",
  "Make an iron grappling hook.",
]
id = "hook"
rewards = [{ xp_levels = 3 }]
subtitle = "Up without climbing"
tasks = [{ item = "yo_hooks:iron_grappling_hook" }]
title = "Up Without Climbing"
x = 0.0
y = 1.5

[[chapters.quests]]
after = ["last_fire"]
description = [
  "A glide from a cliff is over before the phantoms look up.",
  "Make a hang glider.",
]
id = "glider"
rewards = [{ xp_levels = 3 }]
subtitle = "Down without falling"
tasks = [{ item = "hangglider:hang_glider" }]
title = "Down Without Falling"
x = 1.5
y = 1.5

[[chapters.quests]]
after = ["last_fire"]
description = [
  "Stew goes further than raw meat, and the ember is always hungry.",
  "Make a cooking pot.",
]
id = "pot"
rewards = [{ xp_levels = 3 }]
subtitle = "Further than raw meat"
tasks = [{ item = "farmersdelight:cooking_pot" }]
title = "A Pot Over the Fire"
x = -1.5
y = 3.0

[[chapters.quests]]
after = ["last_fire"]
description = [
  "Villages pay a traveller for what they cannot fetch themselves. Take what they give and move on before dark.",
  "Find or make a bounty board.",
]
id = "bounty"
rewards = [{ xp_levels = 3 }]
subtitle = "Work for strangers"
tasks = [{ item = "bountiful:bountyboard" }]
title = "Work for Strangers"
x = 0.0
y = 3.0

[[chapters.quests]]
after = ["last_fire"]
description = [
  "You will never pass this way again. A picture remembers it for you.",
  "Make a camera.",
]
id = "camera"
rewards = [{ xp_levels = 3 }]
subtitle = "Keep what you saw"
tasks = [{ item = "exposure:camera" }]
title = "Keep What You Saw"
x = 1.5
y = 3.0

[[chapters]]
eyes = 1
icon = "endrem:old_eye"
id = "first_eyes"
subtitle = ["Six shards lie near the four winds. The ember finds the nearest first."]
