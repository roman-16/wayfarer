[[chapters]]
icon = "minecraft:end_portal_frame"
id = "last_road"
subtitle = ["Twelve shards remember where the Eye was torn out."]
title = "The Last Road"

[[chapters.quests]]
after_eyes = 2
description = [
  "With all twelve shards, the ember remembers where the Eye was torn out. The portal broke into twelve frames, and the Keepers carried them out to a ring far past every map; any frame takes the whole Eye, and the ember leads you to the nearest.",
  "Follow the ember to the Keepers' stronghold.",
]
id = "true_gate"
rewards = [{ xp_levels = 10 }]
subtitle = "Farther than anyone walks"
tasks = [{ structure = "betterstrongholds:stronghold" }]
title = "The True Gate"
x = 0.0
y = 0.0

[[chapters.quests]]
after = ["true_gate"]
description = [
  "The Gazebound followed your smoke all the way, and the Keepers' ward keeps the frame shut while any of them stands in the hall.",
  "Touch the frame, and drive the Gazebound from the hall.",
]
icon = "minecraft:crossbow"
id = "gate_band"
rewards = [{ xp_levels = 10 }]
subtitle = "The Keepers' ward"
tasks = [{ advancement = "wayfarer:gate" }]
title = "The Gazebound at the Gate"
x = 0.0
y = 1.5

[[chapters.quests]]
after = ["gate_band"]
description = [
  "Twelve shards, twelve sockets, one Eye. Touch any frame with all twelve in your ember, and they set themselves.",
  "Set the Eye and step through.",
]
id = "set_the_eye"
rewards = [{ xp_levels = 10 }]
subtitle = "One Eye again"
tasks = [{ dimension = "minecraft:the_end" }]
title = "Set the Eye"
x = 0.0
y = 3.0

[[chapters]]
icon = "minecraft:dragon_head"
id = "dragon"
subtitle = ["It will never be weaker than now."]
title = "The Dragon"

[[chapters.quests]]
after = ["set_the_eye"]
description = [
  "It is still half-blind, and it will never be weaker than it is today. When it dies, the ember goes out for everyone who fought it.",
  "Kill the dragon.",
]
id = "dragon"
rewards = [{ xp_levels = 30 }]
subtitle = "Finish what we could not"
tasks = [{ kill = "minecraft:ender_dragon" }]
title = "The Half-Blind Dragon"
x = 0.0
y = 0.0

[[chapters]]
icon = "minecraft:red_bed"
id = "home"
subtitle = ["The oath is kept. You may stay."]
title = "Build a Home"

[[chapters.quests]]
after = ["dragon"]
description = [
  "The ember is out and nothing is watching any more. You eat like a settled person, no night is sleepless, the moon stays white, and the sky is yours. Fire still remembers you, and brings you back when you fall.",
  "Stay somewhere at last, and build a home.",
]
id = "home"
rewards = [{ item = "minecraft:red_bed" }]
subtitle = "The last page"
tasks = [{ checkmark = true }]
title = "Build a Home"
x = 0.0
y = 0.0

