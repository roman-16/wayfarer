title = "The Last Wayfarer's Journal"

[[chapters]]
icon = "minecraft:campfire"
id = "oath"
subtitle = ["Never settle. Never stay. Carry the ember."]
title = "The Oath"

[[chapters.quests]]
description = [
  "You sat at my fire when nobody else would, so the ember is yours now. I could not carry it one more day.",
  "Read my letter at the lectern, then take what I leave you: my tent, my mallet and my bedroll.",
]
icon = "minecraft:writable_book"
id = "last_fire"
rewards = [
  { item = "nomadictents:tiny_yurt" },
  { components = { "minecraft:custom_name" = "\"Wayfarer's Mallet\"", "minecraft:unbreakable" = {} }, item = "nomadictents:golden_mallet" },
  { item = "comforts:sleeping_bag_brown" },
]
subtitle = "A stranger's fire, a stranger's ember"
tasks = [{ checkmark = true }]
title = "The Last Fire"
x = 0.0
y = 0.0

[[chapters.quests]]
after = ["last_fire"]
description = [
  "A Wayfarer tent is folded space, and the gaze cannot see what is not anywhere. One blow of the mallet raises it.",
  "Pitch your tent before dark and sleep inside it.",
]
icon = "nomadictents:tiny_yurt"
id = "tent"
rewards = [{ count = 6, item = "minecraft:bread" }]
subtitle = "Safe, because it is nowhere"
tasks = [{ advancement = "wayfarer:nowhere" }]
title = "A Roof That Is Nowhere"
x = -2.25
y = 1.5

[[chapters.quests]]
after = ["last_fire"]
description = [
  "A Wayfarer owns only what they can carry, and leaves the rest for the next traveller.",
  "Make a backpack and wear it on your back.",
]
id = "backpack"
rewards = [{ xp_levels = 3 }]
subtitle = "Everything you own, on your back"
tasks = [{ item = "sophisticatedbackpacks:backpack" }]
title = "Carry What You Own"
x = -0.75
y = 1.5

[[chapters.quests]]
after = ["last_fire"]
description = [
  "The ember is bound to fire: wherever you light one, it brings you back when you fall. The gaze's creatures cannot bear its light, so on an ordinary night none is born within twelve blocks of it, none steps closer, and none goes for you while you stand there.",
  "Make a campfire, light it where you rest, and stand still beside it for half a minute. The ember warms, and until tomorrow's dusk it burns the fire instead of your food.",
]
icon = "minecraft:campfire"
id = "campfire"
rewards = [{ count = 4, item = "minecraft:cooked_beef" }]
subtitle = "Where the ember brings you back"
tasks = [{ advancement = "wayfarer:warm" }]
title = "Keep a Fire"
x = 0.75
y = 1.5

[[chapters.quests]]
after = ["last_fire"]
description = [
  "The ember burns what you eat, twice what a settled stomach would. The more kinds of food you eat, the stronger it keeps you.",
  "Eat something you have not eaten on this road yet; its tooltip tells you when a food is new to you.",
]
icon = "minecraft:baked_potato"
id = "food"
rewards = [{ count = 4, item = "minecraft:apple" }, { count = 4, item = "minecraft:baked_potato" }]
subtitle = "Eat the road"
tasks = [{ checkmark = true }]
title = "Eat What the Road Gives"
x = 2.25
y = 1.5

[[chapters.quests]]
after = ["last_fire"]
description = [
  "When you share a fire, the ember splits. Everyone on a team carries every shard any of you takes, hears the fire together and shows on each other's compass.",
  "Travel with friends by joining one team with the team button at the top left of the inventory screen, or walk alone.",
]
icon = "minecraft:soul_campfire"
id = "share"
rewards = [{ xp_levels = 1 }]
subtitle = "The ember splits"
tasks = [{ checkmark = true }]
title = "Share a Fire"
x = 0.75
y = 3.0

[[chapters.quests]]
after = ["backpack", "campfire", "tent"]
description = [
  "You have lived a Wayfarer's first day, and the ember answers. The compass at the top of your sight feels the shards now: far from one, the ember only flares when you walk towards it and gutters when you walk away.",
  "Within five hundred blocks the shard itself appears on the compass, at the stair down to its shrine. The Twelve Peoples hid every stair under a cover that looks like nothing to anyone without an ember. Walk until it answers.",
]
icon = "minecraft:blaze_powder"
id = "ember"
rewards = [{ auto = "invisible", command = "/wayfarer ember {p}" }]
subtitle = "Flaring, guttering"
tasks = [{ stat = "minecraft:play_time", value = 1 }]
title = "The Ember Wakes"
x = 0.0
y = 4.5

