tasks = ["tent", "fire", "rest"]

[[quests.steps]]
done = [
  { sound = "ember_wakes", text = "The ember in your hand grows warm. [pause] Then, for the first time, it glows." },
  { text = "[low, uneasy] Over the ridge ahead, smoke. Under it, the sky is red." },
  { text = "The ember leans in your palm, the way a needle leans, towards the smoke." },
]
