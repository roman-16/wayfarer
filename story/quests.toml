[[quests]]
act = "prologue"
id = "the_last_fire"
kind = "main"
summary = "I woke by a stranger's fire with no name and no memory of the road. He is dying, and he wants to talk."
title = "The Last Fire"

[quests.reward]
claimed = "You take up his pack: a tent, a little food, and room for everything else."
text = "His pack: a backpack, a tent and a little food."
title = "His Pack"

[[quests.steps]]
id = "the_stranger"
kind = "talk"
lines = [
  { text = "You wake on cold ground. A fire burns beside you, and an old man lies on its other side, watching you." },
  { by = "stranger", text = "There you are. Thought I'd go before you woke." },
]
objective = "Sit with the stranger."
people.stranger = "An old man who found me by the road and brought me to his fire. He was dying."
story = ["I woke by a stranger's fire. I don't know my name, or how I came to be there."]

[[quests.steps.choices]]
id = "who"
reply = "Nobody, now. A man who walked too little and stopped too long."
text = "Who are you?"

[[quests.steps.choices]]
id = "where"
reply = "On the road. Where I found you, near enough."
text = "Where am I?"

[[quests.steps.choices]]
id = "what"
reply = "I was going to ask you that."
text = "What happened to me?"

[[quests.steps]]
id = "the_face"
kind = "talk"
lines = [
  { text = "His shirt is open at the collar. An old white scar runs across his chest, over the heart." },
  { by = "stranger", text = "Let me look at you. Yes. It's you, then." },
]
objective = "Sit with the stranger."
people.stranger = "He knew my face, and wouldn't say how. He had an old white scar over his heart."

[[quests.steps.choices]]
id = "known"
reply = "Better than you'd like. Don't ask me how. There isn't time."
text = "Do you know me?"

[[quests.steps.choices]]
id = "nameless"
reply = "Good. Names are for people who stay."
text = "I don't know my own name."

[[quests.steps]]
id = "the_ember"
kind = "talk"
lines = [
  { by = "stranger", text = "Hold out your hand." },
  { text = "He presses something into your palm: a coal no bigger than a thumb, grey and cold." },
  { by = "stranger", text = "It's cold. It's been cold for years. Walk with it and it wakes. It lives on what you see." },
  { by = "stranger", text = "Three things, then. Walk every day. Never stay long in one place. And never sleep in the open: a tent, with a fire by it." },
]
objective = "Sit with the stranger."
story = ["He gave me his ember, cold as a stone, and told me to walk with it."]
words.ember = "What the stranger gave me: a coal no bigger than a thumb, cold as a stone. He said it wakes if I walk with it, and that it lives on what I see."

[[quests.steps.choices]]
id = "promised"
reply = "That's all I need."
story = "I told him I'd carry it."
text = "I'll carry it."

[[quests.steps.choices]]
id = "doubted"
reply = "Nobody does, at first. Carry it anyway."
story = "I told him I didn't even know who I was. He said to carry it anyway."
text = "I don't even know who I am."

[[quests.steps]]
id = "the_charge"
kind = "talk"
lines = [
  { by = "stranger", text = "Don't let it... the shards. I took them. Don't let it have..." },
  { text = "He doesn't finish. The fire pops. The ember lies cold in your hand." },
]
objective = "Sit with the stranger."
people.stranger = "He died before I learned his name."
story = [
  "He died before he could finish: \"Don't let it... the shards. I took them. Don't let it have...\" I don't know what he meant.",
]
words.shards = "He said he took them, and not to let \"it\" have them. I don't know what they are, or what \"it\" is."

[[quests.steps]]
done = [
  { text = "You lay him by his fire and raise the earth over him. The stone waits for words." },
]
id = "the_grave"
kind = "bury"
objective = "Bury him."
story = ["I buried him by his fire. On the stone I wrote: \"{stone}\""]
unwritten = "I buried him by his fire, and left the stone blank. I didn't know what to write."

[[quests]]
act = "prologue"
after = ["the_last_fire"]
id = "the_first_day"
kind = "main"
summary = "He said never to stay. Walk away from his fire, and make a camp of my own before dark."
title = "The First Day"

[[quests.steps]]
done = [
  { text = "His camp is far behind you now. Make yours before dark." },
]
id = "away"
kind = "walk"
objective = "Walk until his camp is far behind."
story = ["I walked away from his fire, as he told me."]

[[quests.steps]]
id = "camp"
kind = "camp"
objective = "Pitch your tent, light a campfire beside it, and rest by the fire."
story = ["I made my first camp: my tent, and a fire beside it."]

[[quests.steps]]
id = "dusk"
kind = "dusk"
lines = [
  { text = "You sit by your fire. The shadows stretch, and the sky goes gold, then red." },
  { text = "The ember in your hand grows warm. Then, for the first time, it glows." },
  { text = "Over the ridge ahead, smoke. Under it, the sky is red." },
]
objective = "Rest by your fire."
story = [
  "At dusk the ember woke in my hand. It had seen new land, the way he said it would.",
  "Then I saw the smoke over the ridge.",
]
words.ember = "It woke on my first evening on the road. It's warm now, and it glows."

[[quests]]
act = "prologue"
after = ["the_first_day"]
id = "ash"
kind = "main"
summary = "Something is burning over the ridge, a whole town of it. Go and see."
title = "Ash"

[[quests.steps]]
done = [
  { text = "The town burns. Roofs have fallen in, and nothing moves but the fire." },
]
id = "the_town"
kind = "reach"
objective = "Go to the burning town."

[[quests.steps]]
hint = "Hold up the ember ({key}): for a moment it shows what has passed by."
id = "the_dead"
kind = "clues"
needed = 4
objective = "Hold up the ember and find out what happened here. ({found}/{needed})"
story = [
  "Whatever came to the town wasn't after plunder. It opened people over the heart, and left their purses.",
]
words.ember = "Held up, it shows me for a moment what has passed by."

[[quests.steps.clues]]
id = "well"
text = "A man by the well. His shirt is torn open over the heart. His purse is still on his belt."

[[quests.steps.clues]]
id = "doorway"
text = "A woman in a doorway, opened the same way. Her rings are still on her hands."

[[quests.steps.clues]]
id = "strongbox"
text = "A strongbox stands open in the inn, full of emeralds. Nobody took a single one."

[[quests.steps.clues]]
id = "tracks"
text = "Tracks of many feet, out of the dark and back into it. None of them carried anything away."

[[quests.steps.clues]]
id = "cellar"
text = "The bell tower stands, black but whole. Under it, behind a cellar door, someone is crying."

[[quests.steps]]
id = "the_cellar"
kind = "talk"
lines = [
  { by = "agna", text = "Look. They never take anything. They only open the chest." },
  { text = "Behind the cellar door, four faces in the light of a small fire." },
  { by = "hob", text = "Stay back! ...It's a person. It's only a person." },
  { by = "tamsin", text = "Tollbridge stood three hundred years. One night." },
  { by = "pip", text = "You've got fire in your hand. Like in the stories. Are you a Wayfarer?" },
]
objective = "Go down into the cellar."
people.agna = "The healer of Tollbridge. She showed me the dead: they never take anything, she said, they only open the chest."
people.hob = "The smith of Tollbridge, big and frightened, and the first to see I was only a person."
people.pip = "A child of Tollbridge. Pip's mother died the night it burned. Pip thinks I'm a Wayfarer out of the old stories."
people.tamsin = "The elder of Tollbridge. Her town stood three hundred years, she says, and fell in one night."
story = [
  "Four of them were alive, in the cellar under the bell tower: Tamsin, their elder; Agna, the healer; Hob, the smith; and a child, Pip.",
]
words.tollbridge = "Tamsin's town, at a river crossing. It stood three hundred years and burned in one night."
words.wayfarer = "Pip's word for me. In the stories Tollbridge told its children, Wayfarers carried fire and never stayed anywhere."

[[quests.steps.choices]]
id = "unsure"
reply = "Mam said Wayfarers aren't real."
story = "I told Pip I don't know what I am."
text = "I don't know what I am."

[[quests.steps.choices]]
id = "wayfarer"
reply = "Mam said Wayfarers aren't real."
story = "I told Pip I suppose I am one."
text = "I suppose I am."

[[quests.steps]]
id = "their_fire"
kind = "rest"
lines = [
  { by = "agna", text = "Pip. Come here. ...Sit down, you. You're shaking." },
  { by = "hob", text = "Here. I made it for a man who won't be fetching it now." },
]
objective = "Rest by their fire."
people.hob = "He gave me a blade he made for a man who didn't live to fetch it."

[quests.steps.reward]
claimed = "Hob's blade is plain and heavy, and sharper than it looks."
text = "Hob's blade, made for a man who didn't live to fetch it."
title = "Hob's Blade"

[[quests.steps]]
failed = "The door gives way, and everything goes dark."
id = "the_door"
kind = "hold"
lines = [
  { text = "Outside, something scrapes at the stones. Then more of them." },
  { by = "tamsin", text = "They never come back. What did you bring?" },
  { by = "hob", text = "Hold the door!" },
]
objective = "Hold the cellar door until morning."
people.tamsin = "She asked what I brought with me when they came back. I think she meant the ember."
retry = "Try the night again from the cellar"
story = [
  "They came back in the night, for the cellar. Tamsin thinks they came for me. We held the door until morning.",
]
wave = "The cellar door: wave {wave} of {waves}"

[[quests.steps]]
id = "morning"
kind = "dawn"
lines = [
  { text = "The last of them falls back into the dark. The sky greys, and then it is morning." },
  { text = "What is left of them crumbles in the sun." },
]
objective = "Hold the cellar door until morning."

[[quests.steps]]
id = "the_bell"
kind = "talk"
lines = [
  { by = "agna", text = "You carry fire. In the stories, a Wayfarer can feel the way. Lead us somewhere they can't find us." },
  { by = "hob", text = "We'll follow you. Whatever you are." },
  { text = "Tamsin sits by the town's bell, fallen from its tower and black with smoke." },
  { by = "tamsin", text = "The bell comes with us." },
]
objective = "Talk to Tamsin."
people.agna = "She took Pip in, the morning after."
story = [
  "At dawn they asked me to lead them. I don't know where to. Tamsin won't go anywhere without her town's bell.",
]

[[quests.steps.choices]]
id = "leave_it"
reply = "It rang for every child born in Tollbridge. It comes. Hob, the cart."
story = "I told her to leave the bell. She's bringing it anyway."
text = "Leave it. It'll slow us."

[[quests.steps.choices]]
id = "take_it"
reply = "Thank you. Hob, the cart."
story = "I told her we'd take the bell."
text = "We'll take it."

[[quests.steps]]
id = "the_first_fire"
kind = "caravan"
lines = [
  { by = "tamsin", text = "Go on ahead. We'll be by water before dark. Look for our smoke." },
]
objective = "Make for their smoke."

[[quests.steps]]
id = "evening"
kind = "talk"
lines = [
  { by = "tamsin", text = "You walk ahead. We'll follow your marks." },
  { by = "agna", text = "Give me that arm. You've been bleeding since the door." },
  { text = "She binds the cut, and keeps two fingers on your wrist a moment too long." },
  { by = "agna", text = "Slow. Like something asleep. Well. You've had a night." },
  { by = "hob", text = "That blade's yours now. When it's dull you bring it to me. Don't you dare throw it away." },
  { by = "pip", text = "Will you teach me? To be a Wayfarer?" },
]
objective = "Sit at the caravan's fire."
people.agna = "At the fire she held my wrist too long, and said my heart was slow, like something asleep."
people.tamsin = "She made me their scout: I walk ahead, and they follow my marks."
story = [
  "They made camp by water, and I found their smoke. Tamsin says I'm their scout now: I walk ahead, and they follow my marks.",
]

[[quests.steps.choices]]
id = "one_day"
reply = "One day. I'll hold you to it."
story = "Pip asked me to teach the way of a Wayfarer. I said one day."
text = "One day."

[[quests.steps.choices]]
id = "not_a_story"
reply = "I know. I was there."
story = "Pip asked me to teach the way of a Wayfarer. I said it isn't like the stories."
text = "It isn't like the stories."

[[quests.steps]]
done = [
  { text = "The fire burns low. Around it, the last of Tollbridge sleeps." },
]
id = "night"
kind = "sleep"
objective = "Sleep in your tent by their fire."
