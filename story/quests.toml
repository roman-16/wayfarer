[[chapters]]
icon = "smallships:oak_cog"
id = "sea"
subtitle = ["Four shards, and the sea carries you. Six, and the sky does for a while."]
title = "The Sea"

[[chapters.quests]]
after_eyes = 1
description = [
  "On open water a lone ember shines like a beacon, and the gaze finds every ship that carries one. Four shards together are enough to dim it.",
  "Build a ship and sail.",
]
id = "sea_opens"
min_after = 4
rewards = [{ xp_levels = 5 }]
subtitle = "Four shards"
tasks = [{ item = "smallships:oak_cog" }]
title = "The Sea Opens"
x = 0.0
y = 0.0

[[chapters.quests]]
after_eyes = 1
description = [
  "In the air the ember flickers and the phantoms see it. With six shards it burns steady enough to fly, for a while.",
  "Build an aircraft, and land before the gaze fills.",
]
id = "sky_opens"
rewards = [{ xp_levels = 5 }]
subtitle = "Six shards"
tasks = [{ item = "immersive_aircraft:biplane" }]
title = "The Sky, For a While"
x = 0.0
y = 1.5

[[chapters.quests]]
after = ["sky_opens"]
description = [
  "A gyrodyne needs no fuel but your legs. It is slow, and it is quiet.",
  "Build a gyrodyne.",
]
id = "gyrodyne"
rewards = [{ xp_levels = 3 }]
subtitle = "A wing you pedal"
tasks = [{ item = "immersive_aircraft:gyrodyne" }]
title = "A Wing You Pedal"
x = -1.5
y = 3.0

[[chapters.quests]]
after = ["sky_opens"]
description = [
  "A quadrocopter hovers where a biplane cannot: over a shrine's door, or a cliff's edge.",
  "Build a quadrocopter.",
]
id = "quadrocopter"
rewards = [{ xp_levels = 3 }]
subtitle = "Four small wings"
tasks = [{ item = "immersive_aircraft:quadrocopter" }]
title = "Four Small Wings"
x = 0.0
y = 3.0

[[chapters.quests]]
after = ["sky_opens"]
description = [
  "An airship carries more than you can and drifts where the wind lets it. The gaze fills just the same.",
  "Build an airship.",
]
id = "airship"
rewards = [{ xp_levels = 3 }]
subtitle = "A hold in the sky"
tasks = [{ item = "immersive_aircraft:airship" }]
title = "A Hold in the Sky"
x = 1.5
y = 3.0

[[chapters.quests]]
after = ["sky_opens"]
description = [
  "Phantom membrane woven around the ember hides its light from the phantoms that shed it.",
  "Make an Ember Veil and wear it as a charm.",
]
id = "veil_1"
rewards = [{ xp_levels = 3 }]
subtitle = "Longer flight"
tasks = [{ item = "wayfarer:ember_veil_1" }]
title = "A Veil Against the Gaze"
x = -1.5
y = 4.5

[[chapters.quests]]
after = ["veil_1"]
description = [
  "Phantoms weep what they have seen, and their tears remember how not to be seen.",
  "Weave gaze tears into your veil.",
]
id = "veil_2"
rewards = [{ xp_levels = 5 }]
subtitle = "Longer still"
tasks = [{ item = "wayfarer:ember_veil_2" }]
title = "A Thicker Veil"
x = 0.0
y = 4.5

[[chapters.quests]]
after = ["veil_2"]
description = [
  "The deep dark swallowed the Ancient Cities, and its echoes swallow light too.",
  "Weave echo shards into your veil.",
]
id = "veil_3"
rewards = [{ xp_levels = 8 }]
subtitle = "As long as the sky allows"
tasks = [{ item = "wayfarer:ember_veil_3" }]
