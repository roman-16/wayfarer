[[quests]]
act = "prologue"
id = "the_last_fire"
kind = "main"
summary = "I woke by a stranger's fire with no name and no memory of the road. He is dying, and he wants to talk."
title = "The Last Fire"

[quests.reward]
claimed = "You take up his pack: a tent, a bed, a little food, and room for everything else."
items = [
  { id = "sophisticatedbackpacks:backpack" },
  { tent = "tiny" },
  { tag = "minecraft:beds" },
  { count = 16, id = "minecraft:bread" },
]
text = "a backpack, a tent, a bed and a little food."
title = "His Pack"

[[quests.steps]]
id = "the_stranger"
kind = "talk"
lines = [
  { text = "[softly] You wake on cold ground beside a fire. You don't remember lying down. [pause] You don't remember anything before this fire." },
  { text = "An old man sits across the flames, propped against a log. His face is grey, and his breath rattles." },
  { by = "stranger", text = "[weakly, short of breath] There you are. [wheezes] Thought I'd go before you woke." },
]
objective = "Sit with the stranger."
people.stranger = "An old man who found me by the road and brought me to his fire. He was dying."
story = [
  "I woke by a stranger's fire. I don't know my name, or how I came to be there.",
]

[[quests.steps.choices]]
id = "who"
reply = "[a dry, rattling chuckle] Nobody, now. [quietly] An old man who stopped walking, and stayed in one place too long."
text = "[wary] Who are you?"

[[quests.steps.choices]]
id = "where"
reply = "[weakly] By my fire. Off the road, where nobody comes."
text = "[groggy] Where am I?"

[[quests.steps.choices]]
id = "what"
reply = "[a tired huff] I was going to ask you that."
text = "[uneasy] What happened to me?"

[[quests.steps]]
id = "the_face"
kind = "talk"
lines = [
  { by = "stranger", text = "[short of breath] I found you lying by the road and brought you here. [pause] It took the last of what I had." },
  { by = "stranger", text = "[dryly] Don't look at me like that. [coughs] I'm dying, that's all. [weakly] I'm old, and I walked further than I had left in me." },
  { text = "His shirt is open at the collar. An old white scar runs across his chest, over the heart." },
  { by = "stranger", text = "[squinting, quietly] Let me look at you. [long pause] ...Yes. [breathes out] It's you, then." },
]
objective = "Sit with the stranger."
people.stranger = "He said bringing me to his fire took the last of his strength. He knew my face, and wouldn't say how. An old white scar ran over his heart."

[[quests.steps.choices]]
id = "known"
reply = "[a faint, bitter laugh] Better than you'd like. [wheezing] Don't ask me how. There isn't time."
text = "[hesitant] Do you know me?"

[[quests.steps.choices]]
id = "nameless"
reply = "[softly] Good. People who stay in one place have names. You won't be staying."
text = "[quietly, frightened] I don't know my own name."

[[quests.steps]]
id = "the_ember"
kind = "talk"
lines = [
  { text = "He fumbles at his belt and holds out a closed fist. [pause] It shakes." },
  { by = "stranger", text = "[hoarse, insistent] Hold out your hand." },
  { text = "He presses something into your palm: a coal no bigger than a thumb, grey and cold as a stone." },
  { by = "stranger", names = [
    "ember",
  ], text = "[weakly] That's an ember. Mine. [sighs] It's been cold for years." },
  { by = "stranger", text = "[short of breath] Walk with it and it wakes. [pause] It lives on what you see: new ground, every day." },
  { by = "stranger", text = "[gathering his breath] Three things, and I won't have the breath to say them twice." },
  { by = "stranger", text = "[firmly, though weak] Walk every day. A cold ember is no use to anyone." },
  { by = "stranger", text = "[wheezes] Never stay long in one place. [low, urgent] Stay, and something finds you." },
  { by = "stranger", text = "[struggling for breath] And never sleep in the open. A tent, with a fire by it. [whispers] Sleep in the open and something comes to look." },
]
objective = "Sit with the stranger."
story = [
  "He gave me his ember, cold as a stone, and told me to walk with it.",
  "He gave me three rules: walk every day, never stay long in one place, and never sleep in the open, only in a tent with a fire by it.",
]
words.ember = "What the stranger gave me: an ember, a coal no bigger than a thumb, cold as a stone. He said it wakes if I walk with it, and that it lives on what I see."

[[quests.steps.choices]]
id = "promised"
reply = "[relieved, faintly] That's all I need."
story = "I told him I'd carry it."
text = "[quietly] I'll carry it."

[[quests.steps.choices]]
id = "doubted"
reply = "[a faint smile in his voice] Nobody does, at first. [weakly] Carry it anyway."
story = "I told him I didn't even know who I was. He said to carry it anyway."
text = "[lost] I don't even know who I am."

[[quests.steps]]
id = "the_charge"
kind = "talk"
lines = [
  { music = "last_fire", text = "He coughs for a long time. [pause] When he looks up, he looks past you, at something that isn't there." },
  { by = "stranger", text = "[rattling breath, fading] Don't let it... [gasps] the shards. I took them. [barely audible] Don't let it have..." },
  { poses = { stranger = "fallen_slumped" }, text = "[slowly] He doesn't finish. His hand goes slack, and his head drops to his chest." },
]
objective = "Sit with the stranger."
people.stranger = "[quietly] He died before I learned his name."
story = [
  "He died before he could finish: \"Don't let it... the shards. I took them. Don't let it have...\" I don't know what he meant.",
]
words.shards = "He said he took them, and not to let \"it\" have them. I don't know what they are, or what \"it\" is."

[[quests.steps]]
burial = [
  { text = "You dig beside his fire until your hands are raw, and lay him in. At the head of the grave you raise a stone." },
  { text = "[softly] It's blank. You never learned his name." },
  { text = "What do you write on his stone?" },
]
done = [
  { text = "[quietly] You stand at the grave a while. His fire is burning low. [pause] He said not to stay." },
  { text = "His pack lies by the fire. He won't need it now." },
]
id = "the_grave"
kind = "bury"
lines = [
  { pause = true, text = "[softly] The fire pops. [long pause] The old man is dead." },
  { text = "[quietly] You can't leave him here for the crows." },
]
objective = "Bury him."
story = ["I buried him by his fire. On his stone I wrote: \"{stone}\""]
tasks = ["bury"]
unwritten = "I buried him by his fire, and left his stone bare. I didn't know what to write."
whom = "stranger"

[[quests.steps.choices]]
id = "good_man"
reply = "You scratch the words into the stone."
stone = "Here rests a good man, who gave all he had."
text = "Here rests a good man, who gave all he had."

[[quests.steps.choices]]
id = "old_friend"
reply = "You scratch the words into the stone."
stone = "Rest well, old friend."
text = "Rest well, old friend."

[[quests.steps.choices]]
id = "never_forgotten"
reply = "You scratch the words into the stone."
stone = "Gone, but never forgotten."
text = "Gone, but never forgotten."

[[quests.steps.choices]]
id = "bare"
reply = "You leave the stone as it is."
text = "Leave it bare."

