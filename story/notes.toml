[[summary]]
id = "last_camp"
text = "A stranger died at your fire and left you his ember, his tent and his journal. You buried him by the road."
title = "The Last Camp"
when = "start"

[[summary]]
id = "ember_wakes"
text = "You lived a Wayfarer's first day, and the ember answered. It pulls towards the twelve shards of the dragon's broken Eye."
title = "The Ember Wakes"
when = "awake"

[[summary]]
id = "first_shard"
text = "You found the first shrine and took up its shard. It sank into your ember and remembered the beginning: the bright cities, long ago."
title = "The First Shard"
when = "shards:1"

[[summary]]
id = "voice"
text = "After the second shard, the stranger's voice spoke from your ember while you rested at your fire. He said he talks best when you're still."
title = "A Voice at the Fire"
when = "step:first_words"

[[summary]]
id = "first_camp"
text = "You found his first camp and a page from his young years. He was happy on the road once."
title = "His First Camp"
when = "lead:first_camp"

[[summary]]
id = "hooded"
text = "A hooded Illager came to your fire, left you food and vanished into the smoke. The voice told you not to follow her."
title = "The Hooded Traveller"
when = "step:hooded"

[[summary]]
id = "deep_city"
text = "You walked the deep city where it all started, where the Ancient Cities' gate let the silence through."
title = "The Deep City"
when = "lead:deep_city"

[[summary]]
id = "sea"
text = "Four shards dimmed your ember enough for the sea to carry you."
title = "The Sea"
when = "shards:4"

[[summary]]
id = "unsent"
text = "At the Gazebound's outpost you found a letter the hooded woman never sent, to someone she called Captain Wend."
title = "A Letter Never Sent"
when = "lead:outpost"

[[summary]]
id = "last_camp_found"
text = "At his last camp the stranger wrote that the men in grass cloaks left bread by his fire, and he ate it."
title = "Where He Stopped"
when = "lead:last_camp"

[[summary]]
id = "sky"
text = "Six shards steadied the ember enough to fly, for a while."
title = "The Sky"
when = "shards:6"

[[summary]]
id = "wend"
text = "The hooded woman is Maren, of the Gazebound. She says the stranger was Wend, their captain, and that he raised her. At the fire, he admitted it."
title = "Wend"
when = "step:confession"

[[summary]]
id = "grass_halls"
text = "In Wend's room in the grass halls, a ledger said his ember went dark in his ninth winter, and that the Gazebound meant to follow whoever he gave it to."
title = "The Grass Halls"
when = "lead:grass_halls"

[[summary]]
id = "ledger"
text = "The voice said the ledger was wrong, and that his ember never went dark."
title = "The Ledger"
when = "step:ledger"

[[summary]]
id = "sight"
text = "With seven shards, standing still in the dark showed you what walks near you through stone. The voice called it the Grass King's sight."
title = "The Glimpse"
when = "step:sight"

[[summary]]
id = "carry_me_home"
text = "The voice asked you not to stop now, and to carry him home."
title = "Carry Me Home"
when = "step:carry_me_home"

[[summary]]
id = "captains"
text = "Maren warned you that the Gazebound captains are behind her, and that at the gate they will take what you carry."
title = "The Captains"
when = "step:captains"

[[summary]]
id = "unmasked"
text = "The eleventh memory said the dead do not speak. The voice at your fire is the gaze, which learned Wend's voice by watching him sit still for twenty years."
title = "The Voice"
when = "step:unmasked"

[[summary]]
id = "bargain"
text = "The gaze offered to look away from you forever if you bring it its eye."
title = "A Bargain"
when = "step:bargain"

[[summary]]
id = "whole_eye"
text = "All twelve shards rest in your ember, and it remembers where the Eye was torn out."
title = "The Whole Eye"
when = "shards:12"

[[summary]]
id = "gate"
text = "Maren and a Gazebound war band were waiting at the frame. The Keepers' ward kept it shut while they stood in the hall."
title = "The Gazebound at the Gate"
when = "scene:gate_arrival"

[[summary]]
id = "letter"
text = "Maren opened a letter from Wend. He had chosen you to finish it, and asked her to help. She turned on her own band and fought beside you."
title = "Wend's Letter"
when = "scene:gate_letter"

[[summary]]
id = "dragon"
text = "You set the Eye and killed the half-blind dragon. The ember went out, and nothing is watching any more."
title = "The Dragon"
when = "slain"

[[summary]]
id = "just_a_fire"
text = "At your first fire after, Maren sat down with you. There was no voice in the fire."
title = "Just a Fire"
when = "step:just_a_fire"

[[words]]
id = "ancient_cities"
text = "The first great civilisation, deep in the stone. They built a gate to strike back at the dragon, and what came through was silence."
title = "The Ancient Cities"
when = "book:memory/2"

[[words]]
id = "dim"
text = "Stay within about 256 blocks of one place and on the second day the ember dims. On the third the gaze finds you, and its horde comes that night and every night you stay."
title = "A dim ember"
when = "first:dimming"

[[words]]
id = "dragon"
text = "The guardian of the End, bound there by the builders of the End cities. It can never leave the End, and saw the world only through its Eye."
title = "The dragon"
when = "start"

[[words]]
id = "ember"
text = "A sliver of the Eye's own light. It passes only at a fire shared freely, pulls towards the shards, and brings you back to the last fire you lit."
title = "The ember"
when = "start"

[[words]]
id = "eye"
text = "The eye the dragon gave up to watch every land its portal touched. The first Wayfarers tore it out and broke it into twelve shards."
title = "The Eye"
when = "start"

[[words]]
id = "circle"
text = "About twelve blocks around a lit campfire. On an ordinary night no monster is born in it, none steps into it, and none goes for someone standing in it. Illagers are people, and do not fear it."
title = "The fire's circle"
when = "first:warm"

[[words]]
id = "flight"
text = "In the air the ember flickers and the phantoms, the dragon's eyes, see it. Six shards steady it enough to fly until the gaze fills; an Ember Veil lets you fly longer."
title = "Flight"
when = "shards:6"

[[words]]
id = "gaze"
text = "The dragon's sight. It sees what stays still, presses hardest at night, and sees you more clearly every day you carry the ember and with every shard you take."
title = "The gaze"
when = "start"

[[words]]
id = "gazebound"
text = "An Illager cult, heirs of the Grass King, who want the dragon's sight back to rule through it. They cannot find shrines, so they follow your smoke."
title = "The Gazebound"
when = "step:maren_names"

[[words]]
id = "glimpse"
text = "From the seventh shard, standing still in the dark shows you everything that walks within about 32 blocks, through stone."
title = "The glimpse"
when = "step:sight"

[[words]]
id = "grass_king"
text = "A king of the grasslands who kept his people's shard in his crown. It spoke to him in his dead father's voice, and for one summer he saw what the dragon sees."
title = "The Grass King"
when = "book:memory/7"

[[words]]
id = "grave"
text = "Where you fall, the road keeps your things under a stone, each in its place, until you come back for them. The compass marks it."
title = "The grave stone"
when = "first:death"

[[words]]
id = "hunger"
text = "The ember burns what you eat, twice what a settled person needs, unless it is warm from a fire. The more kinds of food you eat, the stronger it keeps you."
title = "Hunger"
when = "start"

[[words]]
id = "illagers"
text = "The Grass Kingdom's outcasts and their children. Their outposts, raids and mansions are the Gazebound's."
title = "Illagers"
when = "book:memory/7"

[[words]]
id = "keepers"
text = "Wayfarers who would not walk. They carried the broken portal's twelve frames out past every map, sealed the world below, and stayed to guard the frames."
title = "The Keepers"
when = "book:memory/6"

[[words]]
id = "leads"
text = "Places someone told you the way to. The compass marks each one from then on, and At the Fire keeps it until you find it."
title = "Leads"
when = "step:first_camp"

[[words]]
id = "maren"
text = "A Gazebound evoker whom Wend raised. She follows your smoke, and comes to your fire as a guest."
title = "Maren"
when = "step:maren_names"

[[words]]
id = "nether"
text = "The burning world below, where the Ancient Cities drew their power from. The Keepers sealed it: obsidian takes no spark."
title = "The world below"
when = "first:portal"

[[words]]
id = "oath"
text = "Never settle, never shine, and never let the shards come together again. The ember answers only someone who keeps it."
title = "The oath"
when = "book:memory/5"

[[words]]
id = "peoples"
text = "The peoples at the far ends of the world who each hid one shard. Their books wait beside the pedestals, and name a place of theirs nearby."
title = "The Twelve Peoples"
when = "first:shrine"

[[words]]
id = "red_dawn"
text = "Every fifth night the Eye is reflected in the moon. Monsters walk thicker and stronger, and are not afraid of a fire's light."
title = "A Red Dawn"
when = "first:blood_moon"

[[words]]
id = "sailing"
text = "On open water a lone ember shines like a beacon. Four shards together dim it enough to sail."
title = "Sailing"
when = "shards:4"

[[words]]
id = "sculk"
text = "The silence that came through the Ancient Cities' gate. It spreads across the stone and remembers every sound. Its guard, the Warden, does not fear fire."
title = "Sculk"
when = "book:memory/3"

[[words]]
id = "shards"
text = "The twelve pieces of the Eye. A shard sinks into the ember and never leaves it, not even when you die. Each one remembers a piece of what happened."
title = "Shards"
when = "shards:1"

[[words]]
id = "shrines"
text = "The halls the Twelve Peoples hid their shards in, under covers that look like nothing to anyone without an ember. No monster is born inside, and no horde follows you in."
title = "Shrines"
when = "first:shrine"

[[words]]
id = "sleepless"
text = "Every fourth night the gaze turns fully towards the world. Nobody sleeps, tents set you outside at dusk, and its horde walks through fire. A shrine still shelters you."
title = "A Sleepless Night"
when = "first:horde"

[[words]]
id = "team"
text = "When you share a fire, the ember splits. Everyone on a team carries every shard any of them takes, and hears the fire together."
title = "Sharing a fire"
when = "start"

[[words]]
id = "tent"
text = "Folded space that is not anywhere. The gaze cannot see into it, its creatures cannot find the door, and nothing of the gaze passes it."
title = "The tent"
when = "first:tent"

[[words]]
id = "true_gate"
text = "Any of the twelve frames in the Keepers' ring. Touched with all twelve shards in your ember, it takes the whole Eye."
title = "The true gate"
when = "shards:12"

[[words]]
id = "voice"
text = "A voice in your ember that sounds like the stranger. It speaks only while you rest at a fire, never inside a tent."
title = "The voice at the fire"
when = "step:first_words"

[[words]]
id = "ward"
text = "The Keepers' ward on every frame: it will not take the Eye while a Gazebound stands in the hall."
title = "The Keepers' ward"
when = "scene:gate_arrival"

[[words]]
id = "warm"
text = "Rest still at a lit fire for half a minute and the ember warms. Until tomorrow's dusk it burns the fire instead of your food."
title = "Warm"
when = "first:warm"

[[words]]
id = "waystones"
text = "Stones the first Wayfarers set along their roads. One folds the road back to any stone you have touched, so it only carries you along roads you have walked."
title = "Waystones"
when = "first:waystone"

[[words]]
id = "wend"
text = "The stranger's name among the Gazebound. He was their captain for twenty winters."
title = "Wend"
when = "step:maren_names"
